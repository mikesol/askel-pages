<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melers ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #14375A;
  --coral: #FF8F7A;
  --card: #E9E4DF;
  --bg: #F1F2F4;
  --text: #1a1a2e;
  --muted: #6b7280;
  --green: #22c55e;
  --border: #d1cdc9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
h1,h2,h3,h4 { font-family: 'Sora', sans-serif; }

/* Nav */
nav { background: var(--navy); color: white; display: flex; align-items: center; gap: 0; padding: 0 24px; height: 56px; }
nav .logo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--coral); margin-right: 32px; letter-spacing: -0.5px; }
nav button { background: none; border: none; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; padding: 0 16px; height: 56px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
nav button:hover { color: white; }
nav button.active { color: white; border-bottom-color: var(--coral); }

/* Views */
.view { display: none; padding: 28px 32px; }
.view.active { display: block; }

/* Cards / containers */
.card { background: var(--card); border-radius: 10px; padding: 20px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.kpi-card { background: white; border-radius: 10px; padding: 20px 24px; border-left: 4px solid var(--coral); }
.kpi-card .kpi-label { font-size: 0.8rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.kpi-card .kpi-value { font-family: 'Sora', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--navy); color: white; }
.btn-coral { background: var(--coral); color: white; }
.btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; }

/* Badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.badge-received { background: #dbeafe; color: #1e40af; }
.badge-washing { background: #e0e7ff; color: #4338ca; }
.badge-drying { background: #fef3c7; color: #92400e; }
.badge-finishing { background: #fce7f3; color: #be185d; }
.badge-ready { background: #dcfce7; color: #166534; }
.badge-invoiced { background: #f3f4f6; color: #6b7280; }
.badge-draft { background: #f3f4f6; color: #6b7280; }
.badge-sent { background: #dbeafe; color: #1e40af; }
.badge-paid { background: #dcfce7; color: #166534; }

/* Table */
table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
th { background: var(--navy); color: white; font-family: 'Sora', sans-serif; font-size: 0.8rem; font-weight: 600; text-align: left; padding: 12px 16px; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafaf9; cursor: pointer; }

/* Kanban */
.kanban { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px; }
.kanban-col { flex: 1; min-width: 200px; background: var(--card); border-radius: 10px; padding: 14px; }
.kanban-col-header { font-family: 'Sora', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--navy); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.kanban-col-header .col-count { background: var(--navy); color: white; border-radius: 12px; padding: 1px 8px; font-size: 0.75rem; }
.order-card { background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; border-left: 3px solid var(--coral); transition: box-shadow 0.15s; }
.order-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.order-card .oc-customer { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
.order-card .oc-meta { font-size: 0.78rem; color: var(--muted); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 12px; padding: 28px; min-width: 480px; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative; }
.modal h2 { font-family: 'Sora', sans-serif; color: var(--navy); margin-bottom: 20px; }
.modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
.form-group textarea { resize: vertical; min-height: 72px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* Summary bar */
.summary-bar { display: flex; gap: 24px; background: white; border-radius: 10px; padding: 16px 24px; margin-bottom: 20px; }
.summary-item { text-align: center; }
.summary-item .s-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.summary-item .s-value { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--navy); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.toolbar input[type=text], .toolbar select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.875rem; }
.toolbar .spacer { flex: 1; }

/* Section title */
.section-title { font-family: 'Sora', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
</style>
</head>
<body>

<nav>
  <div class="logo">Melers ERP</div>
  <button class="active" onclick="showView('dashboard')">Yhteenveto</button>
  <button onclick="showView('orders')">Tilaukset</button>
  <button onclick="showView('customers')">Asiakkaat</button>
  <button onclick="showView('billing')">Laskutus</button>
</nav>

<div id="view-dashboard" class="view active"></div>
<div id="view-orders" class="view"></div>
<div id="view-customers" class="view"></div>
<div id="view-billing" class="view"></div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const VIEWS = ['dashboard','orders','customers','billing'];
let currentView = 'dashboard';

function showView(name) {
  VIEWS.forEach(v => {
    document.getElementById('view-'+v).classList.toggle('active', v===name);
  });
  document.querySelectorAll('nav button').forEach((btn, i) => {
    btn.classList.toggle('active', VIEWS[i]===name);
  });
  currentView = name;
  loadView(name);
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function fmtEur(n) { return (n||0).toLocaleString('fi-FI',{style:'currency',currency:'EUR',minimumFractionDigits:2}); }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString('fi-FI') : '—'; }
function fmtDateTime(ts) { return ts ? new Date(ts).toLocaleString('fi-FI',{dateStyle:'short',timeStyle:'short'}) : '—'; }

const STATUS_LABELS = { received:'Vastaanotettu', washing:'Pesussa', drying:'Kuivumassa', finishing:'Viimeistely', ready:'Valmis', invoiced:'Laskutettu' };
const INV_STATUS_LABELS = { draft:'Luonnos', sent:'Lähetetty', paid:'Maksettu' };
const INDUSTRIES = ['Majoituspalvelut','Ravintola-ala','Kiinteistöpalvelut','Koulutus','Terveys & hyvinvointi','Siivouspalvelut','Toimistopalvelut','Julkinen sektori','Muu'];
const ITEM_TYPES = ['Liinavaatteet','Pyyhkeet','Työtakit','Verhot','Muu'];
const STATUSES = ['received','washing','drying','finishing','ready'];

function statusBadge(s) { return `<span class="badge badge-${s}">${STATUS_LABELS[s]||s}</span>`; }
function invBadge(s) { return `<span class="badge badge-${s}">${INV_STATUS_LABELS[s]||s}</span>`; }

async function api(path, opts) {
  const r = await fetch('/api'+path, opts);
  return r.json();
}

// Placeholder loaders — implemented in subsequent tasks
async function loadView(name) {
  if (name === 'dashboard') await loadDashboard();
  if (name === 'orders') await loadOrders();
  if (name === 'customers') await loadCustomers();
  if (name === 'billing') await loadBilling();
}
async function loadDashboard() {
  const d = await api('/dashboard');
  document.getElementById('view-dashboard').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Tilaukset tänään</div><div class="kpi-value">${d.orders_today}</div></div>
      <div class="kpi-card"><div class="kpi-label">Kg käsitelty tänään</div><div class="kpi-value">${(d.kg_today||0).toFixed(1)} kg</div></div>
      <div class="kpi-card"><div class="kpi-label">Liikevaihto tässä kuussa</div><div class="kpi-value">${fmtEur(d.revenue_mtd)}</div></div>
      <div class="kpi-card" style="border-left-color:${d.overdue_invoices>0?'#ef4444':'var(--coral)'}"><div class="kpi-label">Erääntyneet laskut</div><div class="kpi-value" style="color:${d.overdue_invoices>0?'#ef4444':'var(--navy)'}">${d.overdue_invoices}</div></div>
    </div>
    <div class="section-title">Viimeisimmät tilaukset</div>
    <table>
      <thead><tr><th>Tilaus</th><th>Asiakas</th><th>Paino</th><th>Tila</th><th>Vastaanotettu</th></tr></thead>
      <tbody>
        ${d.recent_orders.map(o=>`<tr onclick="openOrderDetail('${o.id}')">
          <td><code style="font-size:0.8rem">${o.id.slice(0,8)}</code></td>
          <td>${o.customer_name}</td>
          <td>${o.weight_kg} kg</td>
          <td>${statusBadge(o.status)}</td>
          <td>${fmtDateTime(o.received_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}
async function loadOrders() {
  const { orders } = await api('/orders');
  const byStatus = {};
  STATUSES.forEach(s => byStatus[s] = []);
  orders.forEach(o => { if (byStatus[o.status]) byStatus[o.status].push(o); });

  const cols = STATUSES.map(s => `
    <div class="kanban-col">
      <div class="kanban-col-header">
        <span>${STATUS_LABELS[s]}</span>
        <span class="col-count">${byStatus[s].length}</span>
      </div>
      ${byStatus[s].map(o => `
        <div class="order-card" onclick="openOrderDetail('${o.id}')">
          <div class="oc-customer">${o.customer_name}</div>
          <div class="oc-meta">${o.weight_kg} kg · ${(o.items||[]).map(i=>i.item_type).join(', ')}</div>
          <div class="oc-meta" style="margin-top:4px">${fmtDateTime(o.received_at)}</div>
        </div>`).join('')}
    </div>`).join('');

  document.getElementById('view-orders').innerHTML = `
    <div class="toolbar">
      <div class="section-title" style="margin:0">Tuotanto</div>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="openNewOrderModal()">+ Uusi tilaus</button>
    </div>
    <div class="kanban">${cols}</div>`;
}

async function openOrderDetail(id) {
  const { orders } = await api('/orders');
  const o = orders.find(x => x.id === id);
  if (!o) return;

  const statusOpts = [...STATUSES, 'invoiced'].map(s =>
    `<option value="${s}" ${o.status===s?'selected':''}>${STATUS_LABELS[s]||s}</option>`).join('');

  openModal(`
    <h2>Tilaus <code style="font-size:0.9rem">${o.id.slice(0,8)}</code></h2>
    <div class="form-group"><label>Asiakas</label><div style="font-weight:600">${o.customer_name}</div></div>
    <div class="form-row">
      <div class="form-group"><label>Paino (kg)</label><input type="number" id="od-weight" value="${o.weight_kg}" step="0.1"></div>
      <div class="form-group"><label>Tila</label><select id="od-status">${statusOpts}</select></div>
    </div>
    <div class="form-group"><label>Tuotteet</label><div style="font-size:0.875rem">${(o.items||[]).map(i=>`${i.item_type}: ${i.quantity} kpl`).join(', ')||'—'}</div></div>
    <div class="form-group"><label>Huomiot</label><textarea id="od-notes">${o.notes||''}</textarea></div>
    <div class="modal-footer">
      ${o.status==='ready'?`<button class="btn btn-coral" onclick="createInvoiceFromOrder('${o.id}','${o.customer_id}',${o.weight_kg})">Luo lasku</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-primary" onclick="saveOrder('${o.id}')">Tallenna</button>
    </div>
  `);
}

async function saveOrder(id) {
  const status = document.getElementById('od-status').value;
  const weight_kg = parseFloat(document.getElementById('od-weight').value) || 0;
  const notes = document.getElementById('od-notes').value;
  await api(`/orders/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status, weight_kg, notes }) });
  closeModal();
  await loadOrders();
}

async function createInvoiceFromOrder(order_id, customer_id, weight_kg) {
  // Get customer pricing to compute amount
  const { customers } = await api('/customers');
  const c = customers.find(x => x.id === customer_id);
  const amount = c ? (c.pricing_type === 'per_kg' ? c.pricing_value * weight_kg : c.pricing_value) : 0;
  await api('/invoices', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customer_id, order_id, amount }) });
  closeModal();
  await loadOrders();
}

async function openNewOrderModal() {
  const { customers } = await api('/customers');
  const custOpts = customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const itemRows = () => ITEM_TYPES.map(t =>
    `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="flex:1;font-size:0.875rem">${t}</span>
      <input type="number" min="0" value="0" id="ni-${t}" style="width:70px;padding:4px 8px;border:1.5px solid var(--border);border-radius:4px">
      <span style="font-size:0.8rem;color:var(--muted)">kpl</span>
    </div>`).join('');

  openModal(`
    <h2>Uusi tilaus</h2>
    <div class="form-group"><label>Asiakas</label><select id="ni-customer">${custOpts}</select></div>
    <div class="form-group"><label>Paino (kg)</label><input type="number" id="ni-weight" step="0.1" placeholder="0.0"></div>
    <div class="form-group"><label>Tuotteet</label>${itemRows()}</div>
    <div class="form-group"><label>Huomiot</label><textarea id="ni-notes" placeholder="Lisätiedot..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-primary" onclick="submitNewOrder()">Lisää tilaus</button>
    </div>
  `);
}

async function submitNewOrder() {
  const customer_id = document.getElementById('ni-customer').value;
  const weight_kg = parseFloat(document.getElementById('ni-weight').value) || 0;
  const notes = document.getElementById('ni-notes').value;
  const items = ITEM_TYPES.map(t => ({ item_type: t, quantity: parseInt(document.getElementById('ni-'+t).value)||0 })).filter(i=>i.quantity>0);
  await api('/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customer_id, weight_kg, notes, items }) });
  closeModal();
  await loadOrders();
}
let allCustomers = [];

async function loadCustomers(filter) {
  const { customers } = await api('/customers');
  allCustomers = customers;
  renderCustomers(filter || '');
}

function renderCustomers(filter) {
  const q = (filter||'').toLowerCase();
  const filtered = allCustomers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || (c.ytunnus||'').includes(q) || (c.contact||'').toLowerCase().includes(q)
  );
  document.getElementById('view-customers').innerHTML = `
    <div class="toolbar">
      <input type="text" placeholder="Hae asiakasta..." oninput="renderCustomers(this.value)" value="${filter||''}" style="width:240px">
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="openNewCustomerModal()">+ Lisää asiakas</button>
    </div>
    <table>
      <thead><tr><th>Yritys</th><th>Y-tunnus</th><th>Toimiala</th><th>Yhteyshenkilö</th><th>Hinnoittelu</th><th>Luotu</th></tr></thead>
      <tbody>
        ${filtered.map(c=>`<tr onclick="openCustomerDetail('${c.id}')">
          <td><strong>${c.name}</strong></td>
          <td>${c.ytunnus||'—'}</td>
          <td>${c.industry||'—'}</td>
          <td>${c.contact||'—'}</td>
          <td>${c.pricing_type==='per_kg'?`${c.pricing_value} €/kg`:`${fmtEur(c.pricing_value)}/kk`}</td>
          <td>${fmtDate(c.created_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

async function openCustomerDetail(id) {
  const { customer, order_count } = await api(`/customers/${id}`);
  const c = customer;
  const indOpts = INDUSTRIES.map(i=>`<option value="${i}" ${c.industry===i?'selected':''}>${i}</option>`).join('');
  openModal(`
    <h2>${c.name}</h2>
    <div class="form-group"><label>Y-tunnus</label><input type="text" id="cd-ytunnus" value="${c.ytunnus||''}"></div>
    <div class="form-group"><label>Toimiala</label><select id="cd-industry">${indOpts}</select></div>
    <div class="form-row">
      <div class="form-group"><label>Yhteyshenkilö</label><input type="text" id="cd-contact" value="${c.contact||''}"></div>
      <div class="form-group"><label>Puhelin</label><input type="text" id="cd-phone" value="${c.phone||''}"></div>
    </div>
    <div class="form-group"><label>Sähköposti</label><input type="email" id="cd-email" value="${c.email||''}"></div>
    <div class="form-row">
      <div class="form-group"><label>Hinnoittelutyyppi</label><select id="cd-ptype"><option value="per_kg" ${c.pricing_type==='per_kg'?'selected':''}>€/kg</option><option value="flat" ${c.pricing_type==='flat'?'selected':''}>€/kk (kiinteä)</option></select></div>
      <div class="form-group"><label>Hinta</label><input type="number" id="cd-pvalue" step="0.01" value="${c.pricing_value||0}"></div>
    </div>
    <div class="form-group"><label>Sopimustiedot</label><textarea id="cd-notes">${c.contract_notes||''}</textarea></div>
    <div style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">Tilauksia yhteensä: <strong>${order_count}</strong></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-primary" onclick="saveCustomer('${c.id}','${c.name}')">Tallenna</button>
    </div>
  `);
}

async function saveCustomer(id, name) {
  const body = {
    name,
    ytunnus: document.getElementById('cd-ytunnus').value,
    industry: document.getElementById('cd-industry').value,
    contact: document.getElementById('cd-contact').value,
    phone: document.getElementById('cd-phone').value,
    email: document.getElementById('cd-email').value,
    pricing_type: document.getElementById('cd-ptype').value,
    pricing_value: parseFloat(document.getElementById('cd-pvalue').value)||0,
    contract_notes: document.getElementById('cd-notes').value,
  };
  await api(`/customers/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  closeModal();
  await loadCustomers();
}

async function openNewCustomerModal() {
  const indOpts = INDUSTRIES.map(i=>`<option value="${i}">${i}</option>`).join('');
  openModal(`
    <h2>Uusi asiakas</h2>
    <div class="form-group"><label>Yrityksen nimi *</label><input type="text" id="nc-name" placeholder="Yritys Oy"></div>
    <div class="form-group"><label>Y-tunnus</label><input type="text" id="nc-ytunnus" placeholder="0000000-0"></div>
    <div class="form-group"><label>Toimiala</label><select id="nc-industry">${indOpts}</select></div>
    <div class="form-row">
      <div class="form-group"><label>Yhteyshenkilö</label><input type="text" id="nc-contact"></div>
      <div class="form-group"><label>Puhelin</label><input type="text" id="nc-phone"></div>
    </div>
    <div class="form-group"><label>Sähköposti</label><input type="email" id="nc-email"></div>
    <div class="form-row">
      <div class="form-group"><label>Hinnoittelutyyppi</label><select id="nc-ptype"><option value="per_kg">€/kg</option><option value="flat">€/kk (kiinteä)</option></select></div>
      <div class="form-group"><label>Hinta</label><input type="number" id="nc-pvalue" step="0.01" value="0"></div>
    </div>
    <div class="form-group"><label>Sopimustiedot</label><textarea id="nc-notes"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Peruuta</button>
      <button class="btn btn-primary" onclick="submitNewCustomer()">Lisää asiakas</button>
    </div>
  `);
}

async function submitNewCustomer() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) return alert('Yrityksen nimi vaaditaan.');
  const body = {
    name,
    ytunnus: document.getElementById('nc-ytunnus').value,
    industry: document.getElementById('nc-industry').value,
    contact: document.getElementById('nc-contact').value,
    phone: document.getElementById('nc-phone').value,
    email: document.getElementById('nc-email').value,
    pricing_type: document.getElementById('nc-ptype').value,
    pricing_value: parseFloat(document.getElementById('nc-pvalue').value)||0,
    contract_notes: document.getElementById('nc-notes').value,
  };
  await api('/customers', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  closeModal();
  await loadCustomers();
}
async function loadBilling() { document.getElementById('view-billing').innerHTML = '<p style="padding:40px;color:var(--muted)">Ladataan...</p>'; }

// Boot
loadView('dashboard');
</script>
