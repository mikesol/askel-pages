<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askel OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111111;
      --elevated: #1a1a1a;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #ededed;
      --muted: #666666;
      --subtle: #3a3a3a;
      --red: #c0392b;
      --red-light: #e04c3e;
      --blue: #5dade2;
      --green: #2ecc71;
      --yellow: #f39c12;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font-family: inherit; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap { position: relative; margin-right: 44px; flex-shrink: 0; }
    .nav-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      display: inline-block;
      padding: 4px 0;
    }
    .nav-logo span { color: var(--red-light); }

    .logo-dropdown {
      position: absolute; top: 100%; left: 0;
      min-width: 168px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px; display: none; flex-direction: column; gap: 1px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .logo-wrap:hover .logo-dropdown { display: flex; }
    .logo-dropdown-item {
      font-size: 12.5px; color: var(--subtle); padding: 8px 10px; border-radius: 6px;
      display: flex; align-items: center; justify-content: space-between; cursor: default;
    }
    .logo-dropdown-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--subtle);
    }

    .nav-links { display: flex; align-items: center; gap: 2px; flex: 1; }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 13px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.01em;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--text); }

    .nav-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .nav-date { font-size: 12px; color: var(--muted); }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--red); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: white; cursor: pointer; flex-shrink: 0;
    }

    /* ── MAIN ── */
    main { padding: 76px 32px 64px; max-width: 1100px; margin: 0 auto; }
    main.wide { max-width: 1320px; }

    /* ── BREADCRUMB ── */
    .crumbs {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 22px;
    }
    .crumbs .sep { color: var(--subtle); }
    .crumbs button {
      background: none; border: none; color: var(--muted); font: inherit;
      cursor: pointer; padding: 0; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .crumbs button:hover { color: var(--text); }
    .crumbs .current { color: var(--text); }

    /* ── GREETING ── */
    .greeting { margin-bottom: 30px; padding-top: 6px; }
    .greeting-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900; font-size: 48px; letter-spacing: -0.01em; line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ededed 40%, rgba(237,237,237,0.35));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .greeting-sub { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 640px; }

    /* ── CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color 0.2s, transform 0.15s;
      text-decoration: none; color: inherit; cursor: pointer;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .card.static:hover { transform: none; border-color: var(--border); cursor: default; }

    .sec-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .tag-example {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(243,156,18,0.12); color: var(--yellow);
      border: 1px solid rgba(243,156,18,0.22);
    }

    /* ── VISION BANNER ── */
    .vision-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 26px; margin-bottom: 16px;
    }
    .vision-text { font-size: 17px; font-weight: 500; line-height: 1.5; color: var(--text); }

    /* ── SECTION GRID ── */
    .section-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* ── ROADMAP LIST ── */
    .roadmap-list { display: flex; flex-direction: column; gap: 14px; }
    .roadmap-item { }
    .roadmap-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .roadmap-note { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
    .okr-bar { height: 6px; background: var(--elevated); border-radius: 3px; overflow: hidden; }
    .okr-fill { height: 100%; background: var(--red); border-radius: 3px; }

    /* ── FOCUS LIST ── */
    .focus-list { display: flex; flex-direction: column; gap: 10px; }
    .focus-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      font-size: 13px; line-height: 1.4;
    }
    .focus-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red-light); flex-shrink: 0; margin-top: 5px; }

    /* ── ENGINE CARDS ── */
    .engines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 6px; }
    .engine-card { padding: 22px 24px; gap: 14px; }
    .engine-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .engine-name {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px;
      text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.05;
    }
    .engine-name.accent { color: var(--red-light); }
    .engine-kpi-number { font-size: 26px; font-weight: 600; line-height: 1; }
    .engine-kpi-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; text-align: right; }
    .engine-purpose { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .engine-badge {
      margin-top: 12px; display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px;
    }
    .engine-badge.soon { background: rgba(255,255,255,0.06); color: var(--muted); }

    /* ── METRO MAP ── */
    .metro { display: flex; flex-direction: column; align-items: center; margin: 12px 0 8px; }
    .metro-node {
      width: 100%; max-width: 560px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: inherit; cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .metro-node:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .metro-node-name { font-size: 15px; font-weight: 600; }
    .metro-node-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .metro-node-count { font-size: 20px; font-weight: 700; }
    .metro-node-count.zero { color: var(--subtle); }
    .metro-connector { width: 2px; height: 24px; background: var(--subtle); }

    /* ── WORKFLOW PAGE ── */
    .workflow-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .field-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .field-row:last-child { border-bottom: none; }
    .field-label { color: var(--muted); }
    .field-value { font-weight: 500; text-align: right; }

    .task-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 8px; font-size: 13px;
    }
    .task-row:last-child { margin-bottom: 0; }
    .task-row.link { cursor: pointer; text-decoration: none; color: inherit; }
    .task-row.link:hover { border-color: var(--border-hover); }
    .task-row-name { font-weight: 500; }
    .task-row-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .empty-note { font-size: 12.5px; color: var(--muted); font-style: italic; padding: 6px 0; }

    .placeholder-box {
      border: 1px dashed rgba(255,255,255,0.14); border-radius: 10px; padding: 16px;
      color: var(--muted); font-size: 12.5px; line-height: 1.5;
    }
    .placeholder-chip {
      display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      margin: 4px 6px 0 0; color: var(--subtle);
    }
    .placeholder-pill {
      display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      margin: 4px 6px 0 0; color: var(--subtle);
    }

    .card-pad { padding: 20px 22px; }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px;
      text-transform: uppercase; letter-spacing: 0.01em; margin-bottom: 4px;
    }
    .card-owner { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .card-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 4px; }

    .link-out { font-size: 12px; color: var(--blue); text-decoration: none; }
    .link-out:hover { text-decoration: underline; }

    .stack { display: flex; flex-direction: column; gap: 16px; }

    /* ── SOURCING VIEW ── */
    .kpi-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
    .kpi-number {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 44px;
      color: var(--red-light); line-height: 1;
    }
    .kpi-label { font-size: 13px; color: var(--muted); }
    .kpi-sub { display: block; font-size: 11.5px; margin-top: 2px; }

    .thesis-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .thesis-chip {
      font-size: 12px; padding: 6px 12px; border-radius: 16px;
      background: rgba(192,57,43,0.1); border: 1px solid rgba(192,57,43,0.25); color: var(--text);
    }
    .industries-details { margin-top: 14px; }
    .industries-details summary {
      cursor: pointer; font-size: 11.5px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    .industries-details summary:hover { color: var(--text); }

    .prospect-list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow-y: auto; }
    .prospect-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      text-decoration: none; color: inherit; cursor: pointer;
    }
    .prospect-row:hover { border-color: var(--border-hover); }
    .prospect-row-name { font-weight: 500; font-size: 13px; }
    .prospect-row-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .fit-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    .fit-tag.strong { background: rgba(46,204,113,0.14); color: var(--green); }
    .fit-tag.cold { background: rgba(93,173,226,0.14); color: var(--blue); }

    .tri-state { display: inline-block; width: 16px; text-align: center; font-weight: 700; }
    .tri-state.pass { color: var(--green); }
    .tri-state.fail { color: var(--red-light); }
    .tri-state.unknown { color: var(--subtle); }

    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .skill-card { background: var(--elevated); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
    .skill-card-name { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
    .skill-card-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

    /* ── SCREENING VIEW ── */
    .completion-badge {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
      background: rgba(255,255,255,0.06); color: var(--muted);
    }
    .lens-section { margin-bottom: 16px; }
    .lens-section:last-child { margin-bottom: 0; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: background 0.15s, border-color 0.15s;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); }

    /* ── OWNER PICKER (shared: Sourcing, Screening, IC) ── */
    .prospect-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .owner-picker { position: relative; display: flex; align-items: center; gap: 4px; }
    .owner-avatars { display: flex; }
    .owner-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; color: white; margin-left: -6px;
      border: 1.5px solid var(--surface); flex-shrink: 0;
    }
    .owner-avatars .owner-avatar:first-child { margin-left: 0; }
    .owner-add-btn {
      width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.28); color: var(--muted); font-size: 13px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .owner-add-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.5); }
    .owner-menu {
      position: absolute; top: 26px; right: 0; z-index: 20; min-width: 140px;
      background: var(--surface); border: 1px solid var(--border-hover); border-radius: 10px;
      padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .owner-option {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer;
    }
    .owner-option:hover { background: rgba(255,255,255,0.06); }
    .owner-option .owner-avatar { margin-left: 0; }
    .owner-check { margin-left: auto; color: var(--green); font-weight: 700; }

    /* ── IC CHAT PANEL ── */
    .chat-window { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
    .chat-msg { max-width: 82%; display: flex; flex-direction: column; }
    .chat-msg.steve { align-self: flex-start; }
    .chat-msg.partner { align-self: flex-end; align-items: flex-end; }
    .chat-msg-from { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
    .chat-msg-text {
      font-size: 12.5px; line-height: 1.5; padding: 9px 12px; border-radius: 10px;
      background: var(--elevated); border: 1px solid var(--border); display: inline-block; text-align: left;
    }
    .chat-msg.steve .chat-msg-text { background: rgba(192,57,43,0.10); border-color: rgba(192,57,43,0.22); }

    /* ── IC PARTNER VOTE WIDGET ── */
    .vote-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .vote-chip {
      font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); color: var(--text);
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .vote-chip:hover { background: rgba(255,255,255,0.1); }
    .vote-chip.voted { background: rgba(46,204,113,0.16); border-color: rgba(46,204,113,0.4); color: var(--green); }
    .vote-chip.pop { animation: chip-pop 0.35s ease; }
    @keyframes chip-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .vote-tally { font-size: 13px; color: var(--muted); }
    .vote-tally.reached { color: var(--green); font-weight: 600; }

    .confetti-burst { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute; top: -10px; width: 7px; height: 12px; opacity: 0.9;
      animation: confetti-fall 1.1s ease-in forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(220px) rotate(300deg); opacity: 0; }
    }

    /* ── DD EPIC TASK EDITOR ── */
    .dd-epic-section { margin-bottom: 14px; }
    .dd-task-row { display: flex; align-items: center; gap: 8px; }
    .dd-task-row input[type="text"] {
      flex: 1; background: transparent; border: 1px solid transparent; color: var(--text);
      font-size: 12.5px; font-family: inherit; padding: 4px 6px; border-radius: 6px;
    }
    .dd-task-row input[type="text"]:hover, .dd-task-row input[type="text"]:focus {
      border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.03); outline: none;
    }
    .dd-task-row.done input[type="text"] { text-decoration: line-through; color: var(--muted); }
    .dd-task-delete {
      background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer;
      line-height: 1; padding: 2px 4px; flex-shrink: 0;
    }
    .dd-task-delete:hover { color: var(--red-light); }
    .dd-assign-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px;
    }

    /* ── KANBAN ── */
    .kanban-section { margin-top: 28px; }
    .kanban-board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
    .kanban-column {
      flex: 0 0 250px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
    }
    .kanban-col-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; padding: 0 2px;
    }
    .kanban-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .kanban-col-count { font-size: 11px; color: var(--muted); }
    .kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 6px; }
    .kanban-card {
      background: var(--elevated); border: 1px solid var(--border); border-radius: 9px;
      padding: 11px 12px; cursor: pointer; transition: border-color 0.15s;
    }
    .kanban-card:hover { border-color: var(--border-hover); }
    .kanban-card-title { font-size: 13px; font-weight: 500; margin-bottom: 7px; line-height: 1.35; }
    .kanban-card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
    .kc-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px;
    }
    .kc-tag.engine-find { background: rgba(192,57,43,0.14); color: var(--red-light); }
    .kc-tag.engine-fund { background: rgba(93,173,226,0.14); color: var(--blue); }
    .kc-tag.engine-grow { background: rgba(46,204,113,0.12); color: var(--green); }
    .kc-tag.goal { background: rgba(255,255,255,0.06); color: var(--muted); }
    .kanban-card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .kanban-card-owner {
      width: 20px; height: 20px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; color: white;
    }
    .record-hint {
      display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px;
      color: var(--subtle); margin-top: 2px; cursor: default; user-select: none;
    }
    .record-hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red-light); opacity: 0.6; }
    .kanban-card .record-hint { margin-bottom: 7px; }
    .modal .record-hint { font-size: 12px; margin: -8px 0 16px; }

    .add-card-btn, .add-col-btn {
      width: 100%; text-align: left; background: none; border: 1px dashed rgba(255,255,255,0.13);
      color: var(--muted); font-size: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
      margin-top: 8px; transition: color 0.15s, border-color 0.15s;
    }
    .add-card-btn:hover, .add-col-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.28); }
    .add-card-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .add-card-btn:disabled:hover { color: var(--muted); border-color: rgba(255,255,255,0.13); }
    .add-col-wrap { flex: 0 0 200px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
      display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border-hover); border-radius: 14px;
      width: 100%; max-width: 560px; padding: 24px 26px; margin-bottom: 60px;
    }
    .modal-close {
      float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal input[type=text], .modal input[type=number], .modal input[type=datetime-local],
    .modal textarea, .modal select {
      width: 100%; background: var(--elevated); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px; margin-top: 5px;
    }
    .modal textarea { resize: vertical; min-height: 56px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-section-title { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 8px; }
    .checklist-item { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
    .checklist-item input[type=checkbox] { accent-color: var(--red); }
    .checklist-item.done span { text-decoration: line-through; color: var(--muted); }
    .inline-add-row { display: flex; gap: 6px; margin-top: 6px; }
    .inline-add-row input { flex: 1; margin-top: 0; }
    .inline-add-row button {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
      border-radius: 7px; padding: 0 12px; font-size: 12px; cursor: pointer;
    }
    .comment-item { font-size: 12.5px; padding: 8px 10px; background: var(--elevated); border-radius: 7px; margin-bottom: 6px; line-height: 1.4; }
    .attachment-item { font-size: 12.5px; padding: 6px 10px; background: var(--elevated); border-radius: 7px; margin-bottom: 6px; color: var(--blue); }
    .move-select { margin-top: 4px; }

    /* ── CALENDAR ── */
    .calendar-section { margin-top: 16px; }
    .calendar-grid { display: grid; grid-template-columns: 44px repeat(7, 1fr); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .cal-corner { background: var(--elevated); }
    .cal-day-header {
      background: var(--elevated); padding: 8px 6px; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); text-align: center;
      border-left: 1px solid var(--border);
    }
    .cal-day-header.today { color: var(--red-light); }
    .cal-hours { display: flex; flex-direction: column; }
    .cal-hour-label { height: 44px; font-size: 9.5px; color: var(--subtle); text-align: right; padding-right: 5px; padding-top: 2px; border-top: 1px solid var(--border); }
    .cal-day-col { position: relative; border-left: 1px solid var(--border); }
    .cal-hour-cell { height: 44px; border-top: 1px solid var(--border); }
    .cal-block {
      position: absolute; left: 3px; right: 3px; background: rgba(192,57,43,0.22);
      border: 1px solid rgba(192,57,43,0.45); border-radius: 6px; padding: 4px 6px;
      font-size: 10.5px; color: var(--text); overflow: hidden; cursor: pointer; line-height: 1.25;
    }
    .cal-block:hover { border-color: var(--red-light); }
    .cal-block strong { display: block; font-weight: 600; margin-bottom: 1px; }
    .cal-block.highlight { outline: 2px solid var(--red-light); }

    @media (max-width: 760px) {
      .section-row, .workflow-grid, .engines, .modal-row { grid-template-columns: 1fr; }
    }

      const lead = src.leads.find(l => l.id === leadId);

      const s = DATA.findStages.find(x => x.key === stageKey);

      if (stageKey === 'sourcing') return s.prospects.find(x => x.id === itemId);
      if (stageKey === 'screening') return s.leads.find(x => x.id === itemId);
      if (stageKey === 'ic') return s.leads.find(x => x.id === itemId);
      if (stageKey === 'dd') return s.leads.find(x => x.id === itemId);
      return null;

      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${days[d.getDay()]} ${d.getDate()}.${d.getMonth()+1} ${hh}:${mm}`;

    function updateCard(id, field, value) {
      const c = findCard(id);
      if (!c) return;
      c[field] = field === 'estimate' ? (value === '' ? null : parseFloat(value)) : value;
      renderCalendar();
      if (field === 'column' && c.ddDeal) {
        const ddCards = kanban.cards.filter(card => card.ddDeal === c.ddDeal);
        const allDone = ddCards.length > 0 && ddCards.every(card => card.column === 'Done');
        const dd = DATA.findStages.find(s => s.key === 'dd');
        const lead = dd.leads.find(l => l.id === c.ddDeal);
        if (allDone && lead && !lead.ddPromptShown) openDDFundPrompt(c.ddDeal);
      }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // ── CALENDAR RENDER ──
    const CAL_START_HOUR = 6;
    const CAL_END_HOUR = 22;

    function weekDates() {
      const today = new Date();
      const day = today.getDay(); // 0=Sun
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = new Date(today);
      monday.setDate(today.getDate() + mondayOffset);
      monday.setHours(0,0,0,0);
      return Array.from({length:7}, (_,i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });
    }

    function sameDay(a, b) {
      return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }

    function renderCalendar() {
      const root = document.getElementById('calendar-root');
      if (!root) return;

      const days = weekDates();
      const today = new Date();
      const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      const hourLabels = [];
      for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) {
        hourLabels.push(`<div class="cal-hour-label">${h}:00</div>`);
      }

      const dayHeaders = days.map((d,i) =>
        `<div class="cal-day-header${sameDay(d,today) ? ' today' : ''}">${dayLabels[i]} ${d.getDate()}</div>`
      ).join('');

      const totalHeight = (CAL_END_HOUR - CAL_START_HOUR) * 44;

      const dayCols = days.map(d => {
        const hourCells = [];
        for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) hourCells.push(`<div class="cal-hour-cell"></div>`);

        const blocks = kanban.cards.filter(c => {
          if (!c.deadline || !c.estimate) return false;
          const dl = new Date(c.deadline);
          return sameDay(dl, d);
        }).map(c => {
          const dl = new Date(c.deadline);
          const endMins = (dl.getHours() - CAL_START_HOUR) * 60 + dl.getMinutes();
          const startMins = endMins - (c.estimate * 60);
          const clampedStart = Math.max(0, startMins);
          const top = (clampedStart / 60) * 44;
          const height = Math.max(18, ((endMins - clampedStart) / 60) * 44);
          const hh = String(dl.getHours()).padStart(2,'0');
          const mm = String(dl.getMinutes()).padStart(2,'0');
          return `
            <div class="cal-block" style="top:${top}px; height:${height}px;" onclick="highlightCard('${c.id}')" title="${escapeAttr(c.title)}">
              <strong>${escapeHtml(c.title)}</strong>${c.estimate}h · due ${hh}:${mm}
            </div>
          `;
        }).join('');

        return `<div class="cal-day-col" style="height:${totalHeight}px;">${hourCells.join('')}${blocks}</div>`;
      }).join('');

      root.innerHTML = `
        <div class="calendar-grid">
          <div class="cal-corner"></div>
          ${dayHeaders}
          <div class="cal-hours">${hourLabels.join('')}</div>
          ${dayCols}
        </div>
      `;

      renderKanban();
    }

      openCard(id);

      s.leads.forEach(lead => {

        done += c.done; total += c.total;

      return { done, total };
    }

    // ── DD WORKFLOW (charter EPICs, always visible — editable before/after assignment) ──
    function toggleDDTask(epicIdx, taskIdx) {

      s.epics[epicIdx].tasks[taskIdx].done = !s.epics[epicIdx].tasks[taskIdx].done;
      render();

      const s = DATA.findStages.find(x => x.key === 'dd');

      s.epics[epicIdx].tasks[taskIdx].text = value.trim();

      const s = DATA.findStages.find(x => x.key === 'dd');

      render();

      const s = DATA.findStages.find(x => x.key === 'dd');
      s.epics[epicIdx].tasks.push({ text: input.value.trim(), done: false });
      render();
    }

      const s = DATA.findStages.find(x => x.key === 'dd');
      const lead = s.leads[0];
      if (!lead || lead.pushedToWall) return;
      s.epics.forEach(epic => {
        kanban.cards.push({
          id: nextKanbanId(), title: epic.name, column: "To Do",
          deadline: "", estimate: null, owner: epic.owner,
          engine: "find", goal: ROADMAP_GOALS[0],
          desc: `DD EPIC for ${lead.name} — pushed from the Find engine's Due Diligence page.`,
          checklist: epic.tasks.map(t => ({ text: t.text, done: t.done })),
          comments: [], attachments: [],
          ddDeal: lead.id

      });
      lead.pushedToWall = true;
      render();

        return `
          <div class="card static card-pad dd-epic-section">
            <div class="sec-label">${escapeHtml(epic.name)} <span class="card-owner">— ${escapeHtml(epic.owner)}</span></div>
            ${taskRows}
            <div class="inline-add-row">
              <input type="text" id="dd-add-task-${epicIdx}" placeholder="Add task...">
              <button onclick="addDDTask(${epicIdx})">Add</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDDWorkflow(s) {
      const lead = s.leads[0]; // at most one real case this pass

      const headerHtml = lead ? `
        <div class="card static card-pad" style="max-width:640px; margin-bottom:16px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div>
              <div class="card-title">${escapeHtml(lead.name)}</div>
              <div class="card-owner">${escapeHtml(lead.location)} · ${escapeHtml(lead.sector)}</div>
            </div>
            ${renderOwnerPicker('dd', lead.id)}
          </div>
          <div class="field-row"><div class="field-label">Price</div><div class="field-value">${escapeHtml(lead.price)}</div></div>
          <div class="field-row"><div class="field-label">Result</div><div class="field-value">${escapeHtml(lead.result)}</div></div>
          <div class="field-row"><div class="field-label">Champion</div><div class="field-value">${escapeHtml(lead.champion)}</div></div>
          <div style="margin-top:14px; display:flex; gap:16px; flex-wrap:wrap;">
            <a class="link-out" href="${escapeAttr(s.trelloBoard)}" target="_blank" rel="noopener">Open Trello DD board →</a>
            <a class="link-out" href="${escapeAttr(s.driveFolder)}" target="_blank" rel="noopener">Open DD Drive folder →</a>
            <a class="link-out" href="${escapeAttr(s.projectPlanDoc)}" target="_blank" rel="noopener">Open project plan doc →</a>
          </div>
        </div>
      ` : '';

      const riskRows = s.risks.map(r => `<div class="checklist-item"><span>⚠️ ${escapeHtml(r)}</span></div>`).join('');
      const checklistRows = s.checklist.map(c => `
        <div class="checklist-item"><span>${c.url ? `<a class="link-out" href="${escapeAttr(c.url)}" target="_blank" rel="noopener">${escapeHtml(c.label)} →</a>` : escapeHtml(c.label)}</span></div>
      `).join('');

      const pushHtml = !lead
        ? `<button class="add-card-btn" disabled title="Assign a company first">📤 Push DD tasks to project wall</button>`
        : lead.pushedToWall
          ? `<div class="empty-note">✓ Pushed — 5 tasks on the <a href="#/" onclick="navigate('/'); return false;">project wall</a></div>`
          : `<button class="add-card-btn" onclick="pushDDTasksToWall()">📤 Push DD tasks to project wall</button>`;

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">${s.name}</div>
          <div class="greeting-sub">${s.purpose}</div>
        </div>

        ${headerHtml}
        ${renderDDAssignBox(s)}

        <div class="card static card-pad">
          <div class="sec-label">Objective</div>
          <div class="card-desc">${escapeHtml(s.objective)}</div>
        </div>

        ${renderDDEpics(s)}

        <div class="card static card-pad dd-epic-section">
          <div class="sec-label">Risks</div>
          ${riskRows}
        </div>

        <div class="card static card-pad dd-epic-section">
          <div class="sec-label">SMART Goal</div>
          <div class="card-desc">${escapeHtml(s.smartGoal)}</div>
        </div>

        <div class="card static card-pad dd-epic-section">
          <div class="sec-label">DD Checklist</div>
          ${checklistRows}
        </div>

        <div class="card static card-pad" style="margin-top:16px;">
          ${pushHtml}
        </div>
      `;
    }

    // ── SCREEN 3: Workflow page ──
    function renderWorkflow(key) {
      const s = DATA.findStages.find(x => x.key === key);
      if (!s) return renderFind();
      if (key === 'sourcing') return renderSourcingWorkflow(s);
      if (key === 'screening') return renderScreeningWorkflow(s);
      if (key === 'ic') return renderICWorkflow(s);
      if (key === 'dd') return renderDDWorkflow(s);

      let tasksHtml = '';
      if (s.task) {
        tasksHtml = `
          <div class="task-row link" onclick="navigate('/find/${s.key}/task/${s.task.id}')">
            <div>
              <div class="task-row-name">${s.task.name}</div>
              <div class="task-row-meta">Owner: ${s.task.owner} · Asking price ${s.task.price}</div>
            </div>
            <div>→</div>
          </div>
        `;
      } else if (s.sample.length) {
        tasksHtml = s.sample.map(n => `
          <div class="task-row"><div><div class="task-row-name">${n}</div></div></div>
        `).join('');
      } else {
        tasksHtml = `<div class="empty-note">Nothing in this stage right now.${s.note ? ' ' + s.note : ''}</div>`;
      }

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">${s.name}</div>
          <div class="greeting-sub">${s.purpose}</div>
        </div>

        <div class="workflow-grid">
          <div class="stack">
            <div class="card static card-pad">
              <div class="sec-label">Open items (${s.count})</div>
              ${tasksHtml}
            </div>
            <div class="card static card-pad">
              <div class="sec-label">Related workflows <span class="tag-example">Knowledge graph — coming soon</span></div>
              <div class="placeholder-box">
                <span class="placeholder-pill">→ Fund · LOI</span>
                <span class="placeholder-pill">→ Grow · Onboarding</span>
                <span class="placeholder-pill">→ Screening</span>
              </div>
            </div>
          </div>
          <div class="stack">
            <div class="card static card-pad">
              <div class="sec-label">Owner</div>
              <div class="card-desc">${s.owner}</div>
            </div>
            <div class="card static card-pad">
              <div class="sec-label">AI Assistant <span class="tag-example">Not functional yet</span></div>
              <div class="placeholder-box">
                Ask this workflow anything.
                <div style="margin-top:8px;">
                  <span class="placeholder-chip">Summarize this stage</span>
                  <span class="placeholder-chip">What's blocked?</span>
                  <span class="placeholder-chip">What should I prioritize?</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ── SCREENING TASK DETAIL ──
    const SCREENING_SECTION_ICON = { financial: '💰', market: '📊', resources: '👥', dealTerms: '🤝', killQuestions: '☠️' };

    function renderScreeningTask(leadId) {
      const s = DATA.findStages.find(x => x.key === 'screening');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return renderScreeningWorkflow(s);

      const allDone = lead.sections.every(sec => sec.items.every(item => item.done));

      const sectionsHtml = lead.sections.map(sec => {
        const itemsHtml = sec.items.map((item, i) => `
          <div class="checklist-item ${item.done ? 'done' : ''}">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleScreeningItem('${lead.id}','${sec.key}',${i})">
            <span>${item.url
              ? `<a class="link-out" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.label)} →</a>`
              : escapeHtml(item.label)}</span>
          </div>
        `).join('');
        return `
          <div class="card static card-pad lens-section">
            <div class="sec-label">${SCREENING_SECTION_ICON[sec.key] || ''} ${escapeHtml(sec.name)}</div>
            ${itemsHtml}
          </div>
        `;
      }).join('');

      const extraLinkHtml = lead.extraLink
        ? `<a class="link-out" href="${escapeAttr(lead.extraLink.url)}" target="_blank" rel="noopener">${escapeHtml(lead.extraLink.label)}</a>`
        : '';

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name, path: '/find/screening' }, { label: lead.name }])}

        <div class="card static card-pad" style="max-width:640px; margin-bottom:16px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div>
              <div class="card-title">${escapeHtml(lead.name)}</div>
              <div class="card-owner">${escapeHtml(lead.location)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              ${renderOwnerPicker('screening', lead.id)}
              <button class="pill-btn" onclick="alert('Coming soon — will create/open a Drive folder for ${escapeAttr(lead.name)} containing its financial analysis and development plan.')">📁 Drive Folder</button>
            </div>
          </div>

          <div class="field-row"><div class="field-label">Revenue</div><div class="field-value">${escapeHtml(lead.revenue)}</div></div>
          <div class="field-row"><div class="field-label">Profit</div><div class="field-value">${escapeHtml(lead.profit)}</div></div>
          <div class="field-row"><div class="field-label">Team size</div><div class="field-value">${escapeHtml(lead.teamSize)}</div></div>
          <div class="field-row"><div class="field-label">Founded</div><div class="field-value">${escapeHtml(lead.founded)}</div></div>
          <div class="field-row"><div class="field-label">Y-tunnus</div><div class="field-value">${escapeHtml(lead.ytunnus)}</div></div>
          <div class="field-row"><div class="field-label">CEO / Owner</div><div class="field-value">${escapeHtml(lead.ceo)}</div></div>
          <div class="field-row"><div class="field-label">Contact</div><div class="field-value">${escapeHtml(lead.contact)}</div></div>

          <div class="sec-label" style="margin-top:14px;">Why interesting</div>
          <div class="card-desc">${escapeHtml(lead.whyInteresting)}</div>

          <div style="margin-top:14px; display:flex; gap:16px;">
            <a class="link-out" href="${escapeAttr(lead.trello)}" target="_blank" rel="noopener">Open Trello card →</a>
            ${extraLinkHtml}
          </div>
        </div>

        ${sectionsHtml}

        <div class="card static card-pad" style="margin-top:16px;">
          <button class="add-card-btn" style="margin-top:0;" onclick="openExecSummaryModal('${lead.id}')">📄 Executive Summary</button>
          <button class="add-card-btn" onclick="openDevPlanModal('${lead.id}')">📋 Development Plan</button>
          <button class="add-card-btn" ${allDone ? '' : 'disabled'} onclick="moveToIC('${lead.id}')">${allDone ? '✓ Move to IC' : 'Move to IC — complete all checklists first'}</button>
        </div>
      `;
    }

    function toggleScreeningItem(leadId, sectionKey, itemIndex) {
      const s = DATA.findStages.find(x => x.key === 'screening');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return;
      const section = lead.sections.find(sec => sec.key === sectionKey);
      section.items[itemIndex].done = !section.items[itemIndex].done;
      document.getElementById('app').innerHTML = renderScreeningTask(leadId);
    }

    function moveToIC(leadId) {
      const screening = DATA.findStages.find(x => x.key === 'screening');
      const ic = DATA.findStages.find(x => x.key === 'ic');
      const idx = screening.leads.findIndex(l => l.id === leadId);
      if (idx === -1) return;
      const [lead] = screening.leads.splice(idx, 1);
      screening.count = screening.leads.length;
      ic.sample.push(lead.name);
      ic.count = ic.sample.length + ic.leads.length; // .leads holds the fixed demo lead; .sample holds anything moved over from Screening
      navigate('/find/screening');
    }

    // ── IC TASK DETAIL ──
    function toggleICKillQuestion(leadId, index) {
      const s = DATA.findStages.find(x => x.key === 'ic');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return;
      lead.killQuestions[index].done = !lead.killQuestions[index].done;
      render();
    }

    function renderICKillQuestions(lead) {
      const itemsHtml = lead.killQuestions.map((item, i) => `
        <div class="checklist-item ${item.done ? 'done' : ''}">
          <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleICKillQuestion('${lead.id}',${i})">
          <span>${escapeHtml(item.label)}</span>
        </div>
      `).join('');
      return `
        <div class="card static card-pad lens-section">
          <div class="sec-label">☠️ Kill Questions</div>
          ${itemsHtml}
        </div>
      `;
    }

    function renderICChat(lead) {
      const bubbles = lead.chat.map(m => `
        <div class="chat-msg ${m.from}">
          <div class="chat-msg-from">${m.from === 'steve' ? '🦔 Steve' : 'Partner'}</div>
          <div class="chat-msg-text">${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      return `
        <div class="card static card-pad" style="margin-top:16px;">
          <div class="sec-label">💬 Chat with Steve <span class="tag-example">Demo transcript — not a live conversation</span></div>
          <div class="chat-window">${bubbles}</div>
        </div>
      `;
    }

    function renderICTask(leadId) {
      const s = DATA.findStages.find(x => x.key === 'ic');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return renderICWorkflow(s);

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name, path: '/find/ic' }, { label: lead.name }])}

        <div class="card static card-pad" style="max-width:640px; margin-bottom:16px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div>
              <div class="card-title">${escapeHtml(lead.name)}</div>
              <div class="card-owner">${escapeHtml(lead.location)} · ${escapeHtml(lead.sector)}</div>
            </div>
            ${renderOwnerPicker('ic', lead.id)}
          </div>

          <div class="field-row"><div class="field-label">Price</div><div class="field-value">${escapeHtml(lead.price)}</div></div>
          <div class="field-row"><div class="field-label">Result</div><div class="field-value">${escapeHtml(lead.result)}</div></div>
          <div class="field-row"><div class="field-label">Champion</div><div class="field-value">${escapeHtml(lead.champion)}</div></div>

          <div style="margin-top:14px; display:flex; gap:16px;">
            <a class="link-out" href="${escapeAttr(lead.trello)}" target="_blank" rel="noopener">Open Trello card →</a>
            <a class="link-out" href="${escapeAttr(lead.loiUrl)}" target="_blank" rel="noopener">Open LOI draft →</a>
          </div>
        </div>

        ${renderICKillQuestions(lead)}

        ${renderICChat(lead)}

        <div class="card static card-pad" style="margin-top:16px;">
          <button class="add-card-btn" style="margin-top:0;" onclick="window.open('https://appoy.askelventures.com', '_blank')">📊 Create IC Presentation</button>
          <button class="add-card-btn" onclick="toggleICCalendar()">🗓️ ${icCalendarVisible ? 'Hide' : 'Show'} partners' calendar</button>
          <button class="add-card-btn" onclick="alert('Coming soon — would create a real Google Calendar event with the partners.')">+ Create meeting</button>
        </div>

        <div class="calendar-section" id="ic-calendar-wrap" style="display:${icCalendarVisible ? 'block' : 'none'};">
          <div class="sec-label" style="margin-bottom:12px;">🗓️ Partners' Calendar <span class="tag-example">Mock calendar — not your real Google Calendar</span></div>
          <div id="calendar-root"></div>
        </div>

        ${renderICVoteWidget(lead)}
      `;
    }

    let icCalendarVisible = false;
    function toggleICCalendar() {
      icCalendarVisible = !icCalendarVisible;
      render();
    }

    const IC_VOTE_THRESHOLD = 3;
    let icLastToggledPartner = null; // one-shot: which chip should play the pop animation on this render
    let icCelebrationPending = false; // one-shot: whether to render a confetti burst on this render

    function toggleICVote(leadId, partner) {
      const s = DATA.findStages.find(x => x.key === 'ic');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return;
      const idx = lead.votes.indexOf(partner);
      if (idx === -1) lead.votes.push(partner); else lead.votes.splice(idx, 1);
      icLastToggledPartner = partner;
      if (lead.votes.length >= IC_VOTE_THRESHOLD && !lead.celebrated) {
        lead.celebrated = true;
        lead.chat.push({ from: 'steve', text: "🎉 3/4 — we're in! I'll start prepping the DD kickoff checklist for Auran Pesupojat." });
        icCelebrationPending = true;
        assignLeadToDD('ic', lead.id);
      }
      render();
    }

    function renderConfettiBurst() {
      const colors = ['#e04c3e', '#f39c12', '#2ecc71', '#5dade2'];
      const pieces = Array.from({ length: 24 }, (_, i) => {
        const left = Math.round(Math.random() * 100);
        const delay = (Math.random() * 0.3).toFixed(2);
        return `<div class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; background:${colors[i % colors.length]};"></div>`;
      }).join('');
      return `<div class="confetti-burst">${pieces}</div>`;
    }

    function renderICVoteWidget(lead) {
      const chips = PARTNERS.map(p => {
        const voted = lead.votes.includes(p);
        const justToggled = icLastToggledPartner === p;
        return `<button class="vote-chip ${voted ? 'voted' : ''}${justToggled ? ' pop' : ''}" onclick="toggleICVote('${lead.id}','${p}')">${voted ? '✓ ' : ''}${p}</button>`;
      }).join('');
      icLastToggledPartner = null;

      const tally = lead.votes.length;
      const reached = tally >= IC_VOTE_THRESHOLD;

      const showConfetti = icCelebrationPending;
      icCelebrationPending = false;

      return `
        <div class="card static card-pad" style="margin-top:16px; position:relative; overflow:hidden;">
          <div class="sec-label">🗳️ Partner Vote <span class="tag-example">In-session only — resets on reload</span></div>
          <div class="vote-chips">${chips}</div>
          <div class="vote-tally${reached ? ' reached' : ''}">${tally}/4 to proceed ${reached ? '🎉' : '(need 3/4)'}</div>
          ${showConfetti ? renderConfettiBurst() : ''}
        </div>
      `;
    }

    // ── SCREEN 4b: Prospect detail (Sourcing) ──
    const TRI_STATE_ICON = { pass: '✓', fail: '✗', unknown: '?' };

    function renderProspectTask(prospectId) {
      const s = DATA.findStages.find(x => x.key === 'sourcing');
      const p = s.prospects.find(x => x.id === prospectId);
      if (!p) return renderSourcingWorkflow(s);

      const checklistHtml = p.checklist.map(item => `
        <div class="checklist-item">
          <span class="tri-state ${item.state}">${TRI_STATE_ICON[item.state]}</span>
          <span>${escapeHtml(item.label)}</span>
        </div>
      `).join('');

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name, path: '/find/sourcing' }, { label: p.name }])}

        <div class="card static card-pad" style="max-width:640px;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div>
              <div class="card-title">${escapeHtml(p.name)}</div>
              <div class="card-owner">Source: ${escapeHtml(p.source)} &nbsp;<span class="fit-tag ${p.tag === 'Strong fit' ? 'strong' : 'cold'}">${p.tag}</span></div>
            </div>
            ${renderOwnerPicker('sourcing', p.id)}
          </div>

          <div class="field-row"><div class="field-label">Price</div><div class="field-value">${escapeHtml(p.price)}</div></div>
          <div class="field-row"><div class="field-label">Result / profit</div><div class="field-value">${escapeHtml(p.result)}</div></div>
          <div class="field-row"><div class="field-label">Location</div><div class="field-value">${escapeHtml(p.location)}</div></div>

          <div class="sec-label" style="margin-top:18px;">Gate checklist</div>
          ${checklistHtml}

          <div style="margin-top:14px; display:flex; gap:16px;">
            <a class="link-out" href="${escapeAttr(p.sourceUrl)}" target="_blank" rel="noopener">Open source listing →</a>
            <a class="link-out" href="${escapeAttr(p.trello)}" target="_blank" rel="noopener">Open Trello card →</a>
          </div>

          <button class="add-card-btn" style="margin-top:16px;" onclick="alert('Coming soon — will create a Kanban task from this prospect.')">+ Create Task</button>
        </div>
      `;
    }

    // ── SCREEN 4: Task view ──
    function renderTask(stageKey, taskId) {
      const s = DATA.findStages.find(x => x.key === stageKey);
      const t = s && s.task && s.task.id === taskId ? s.task : null;
      if (!t) return renderFind();

      const docsHtml = t.docs.map(d => `<div class="field-row"><div class="field-value" style="text-align:left;">${d}</div></div>`).join('');

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Find', path: '/find' }, { label: s.name, path: '/find/' + s.key }, { label: t.name }])}

        <div class="card static card-pad" style="max-width:640px;">
          <div class="card-title">${t.name}</div>
          <div class="card-owner">Owner: ${t.owner} · Stage: ${s.name}</div>

          <div class="field-row"><div class="field-label">Asking price</div><div class="field-value">${t.price}</div></div>
          <div class="field-row"><div class="field-label">Result / EBITDA</div><div class="field-value">${t.result}</div></div>
          <div class="field-row"><div class="field-label">Location</div><div class="field-value">${t.location}</div></div>
          <div class="field-row"><div class="field-label">Sector</div><div class="field-value">${t.sector}</div></div>

          <div class="sec-label" style="margin-top:18px;">Related documents</div>
          ${docsHtml}

          <div style="margin-top:14px;">
            <a class="link-out" href="${t.trello}" target="_blank" rel="noopener">Open Trello card →</a>
          </div>
        </div>
      `;
    }

    // ── Fund / Grow placeholder ──
    function renderPlaceholderEngine(key) {
      const e = DATA.engines[key];
      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: e.name }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">${e.name}</div>
          <div class="greeting-sub">${e.purpose}</div>
        </div>
        <div class="card static card-pad" style="max-width:520px;">
          <div class="sec-label">Coming in a later iteration</div>
          <div class="card-desc">This engine's metro-map and workflow pages aren't built yet — this pass focuses on validating the navigation model using Find as the deep example. If that model tests well, Fund and Grow get the same treatment next.</div>
        </div>
      `;
    }

    window.addEventListener('hashchange', render);
    render();
  </script>

</body>
</html>
