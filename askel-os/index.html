<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askel OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --elevated: #111111;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #ededed;
      --muted: #888888;
      --subtle: #555555;
      --red: #ffffff; /* brand accent — 2026 rebrand dropped red entirely; var name kept to avoid renaming ~30 call sites */
      --red-light: #cfcfcf;
      --blue: #5dade2;
      --green: #2ecc71;
      --yellow: #f39c12;
      --danger: #e5484d; /* functional alert/fail/delete red — distinct from the old brand red, kept for semantic clarity only */
      --cat-find: #7b6fd6;
      --cat-fund: #8fd0d6;
      --cat-grow: #e8935a;
      --brand-gradient: linear-gradient(90deg, #e8935a 0%, #7b6fd6 100%);
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 1; opacity: 0.03; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    a { color: inherit; }
    button { font-family: inherit; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap { position: relative; margin-right: 44px; flex-shrink: 0; }
    .nav-logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      display: inline-block;
      padding: 4px 0;
    }
    .nav-logo span {
      background: var(--brand-gradient);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .logo-dropdown {
      position: absolute; top: 100%; left: 0;
      min-width: 168px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px; display: none; flex-direction: column; gap: 1px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .logo-wrap:hover .logo-dropdown { display: flex; }
    .logo-dropdown-item {
      font-size: 12.5px; color: var(--subtle); padding: 8px 10px; border-radius: 6px;
      display: flex; align-items: center; justify-content: space-between; cursor: default;
    }
    .logo-dropdown-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--subtle);
    }

    .nav-links { display: flex; align-items: center; gap: 2px; flex: 1; }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 13px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.01em;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--text); }

    .nav-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .nav-date { font-size: 12px; color: var(--muted); }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--red); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--bg); cursor: pointer; flex-shrink: 0;
    }

    /* ── MAIN ── */
    main { padding: 76px 32px 64px; max-width: 1100px; margin: 0 auto; }
    main.wide { max-width: 1320px; }

    /* ── BREADCRUMB ── */
    .crumbs {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 22px;
    }
    .crumbs .sep { color: var(--subtle); }
    .crumbs button {
      background: none; border: none; color: var(--muted); font: inherit;
      cursor: pointer; padding: 0; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .crumbs button:hover { color: var(--text); }
    .crumbs .current { color: var(--text); }

    /* ── GREETING ── */
    .greeting { margin-bottom: 30px; padding-top: 6px; }
    .greeting-text {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 1.05;
      text-transform: none;
      background: linear-gradient(135deg, #ededed 40%, rgba(237,237,237,0.35));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .greeting-sub { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 640px; }
    .greeting-emoji {
      -webkit-text-fill-color: initial; background: none; -webkit-background-clip: initial; background-clip: initial;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color 0.2s, transform 0.15s;
      text-decoration: none; color: inherit; cursor: pointer;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .card.static:hover { transform: none; border-color: var(--border); cursor: default; }

    .sec-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .tag-example {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(243,156,18,0.12); color: var(--yellow);
      border: 1px solid rgba(243,156,18,0.22);
    }

    /* ── VISION BANNER ── */
    .vision-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 26px; margin-bottom: 16px;
    }
    .vision-text { font-size: 17px; font-weight: 500; line-height: 1.5; color: var(--text); }

    /* ── SECTION GRID ── */
    .section-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* ── ROADMAP LIST ── */
    .roadmap-list { display: flex; flex-direction: column; gap: 14px; }
    .roadmap-item { }
    .roadmap-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .roadmap-note { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
    .okr-bar { height: 6px; background: var(--elevated); border-radius: 3px; overflow: hidden; }
    .okr-fill { height: 100%; background: var(--red); border-radius: 3px; }

    /* ── FOCUS LIST ── */
    .focus-list { display: flex; flex-direction: column; gap: 10px; }
    .focus-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      font-size: 13px; line-height: 1.4;
    }
    .focus-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red-light); flex-shrink: 0; margin-top: 5px; }

    /* ── ENGINE CARDS ── */
    .engines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 6px; }
    .engine-card { padding: 22px 24px; gap: 14px; }
    .engine-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .engine-name {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 26px;
      text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.05;
    }
    .engine-name.accent { color: var(--cat-find); }
    .engine-kpi-number { font-size: 26px; font-weight: 600; line-height: 1; }
    .engine-kpi-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; text-align: right; }
    .engine-purpose { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .engine-badge {
      margin-top: 12px; display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 9px; border-radius: 4px;
    }
    .engine-badge.soon { background: rgba(255,255,255,0.06); color: var(--muted); }

    /* ── METRO MAP ── */
    .metro { display: flex; flex-direction: column; align-items: center; margin: 12px 0 8px; }
    .metro-node {
      width: 100%; max-width: 560px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: inherit; cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .metro-node:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .metro-node-name { font-size: 15px; font-weight: 600; }
    .metro-node-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .metro-node-count { font-size: 20px; font-weight: 700; }
    .metro-node-count.zero { color: var(--subtle); }
    .metro-connector { width: 2px; height: 24px; background: var(--subtle); }

    /* ── WORKFLOW PAGE ── */
    .workflow-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .field-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .field-row:last-child { border-bottom: none; }
    .field-label { color: var(--muted); }
    .field-value { font-weight: 500; text-align: right; }

    .task-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 8px; font-size: 13px;
    }
    .task-row:last-child { margin-bottom: 0; }
    .task-row.link { cursor: pointer; text-decoration: none; color: inherit; }
    .task-row.link:hover { border-color: var(--border-hover); }
    .task-row-name { font-weight: 500; }
    .task-row-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .empty-note { font-size: 12.5px; color: var(--muted); font-style: italic; padding: 6px 0; }

    .placeholder-box {
      border: 1px dashed rgba(255,255,255,0.14); border-radius: 10px; padding: 16px;
      color: var(--muted); font-size: 12.5px; line-height: 1.5;
    }
    .placeholder-chip {
      display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 6px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      margin: 4px 6px 0 0; color: var(--subtle);
    }
    .placeholder-pill {
      display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      margin: 4px 6px 0 0; color: var(--subtle);
    }

    .card-pad { padding: 20px 22px; }
    .card-title {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 22px;
      text-transform: uppercase; letter-spacing: 0.01em; margin-bottom: 4px;
    }
    .card-owner { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .card-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 4px; }

    .link-out { font-size: 12px; color: var(--blue); text-decoration: none; }
    .link-out:hover { text-decoration: underline; }

    .stack { display: flex; flex-direction: column; gap: 16px; }

    /* ── SOURCING VIEW ── */
    .kpi-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
    .kpi-number {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 44px;
      color: var(--cat-find); line-height: 1;
    }
    .kpi-label { font-size: 13px; color: var(--muted); }
    .kpi-sub { display: block; font-size: 11.5px; margin-top: 2px; }

    .thesis-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .thesis-chip {
      font-size: 12px; padding: 6px 12px; border-radius: 16px;
      background: rgba(123,111,214,0.12); border: 1px solid rgba(123,111,214,0.3); color: var(--text);
    }
    .industries-details { margin-top: 14px; }
    .industries-details summary {
      cursor: pointer; font-size: 11.5px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    .industries-details summary:hover { color: var(--text); }

    .prospect-list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow-y: auto; }
    .prospect-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; background: var(--elevated); border-radius: 8px; border: 1px solid var(--border);
      text-decoration: none; color: inherit; cursor: pointer;
    }
    .prospect-row:hover { border-color: var(--border-hover); }
    .prospect-row-name { font-weight: 500; font-size: 13px; }
    .prospect-row-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .fit-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    .fit-tag.strong { background: rgba(46,204,113,0.14); color: var(--green); }
    .fit-tag.cold { background: rgba(93,173,226,0.14); color: var(--blue); }

    .tri-state { display: inline-block; width: 16px; text-align: center; font-weight: 700; }
    .tri-state.pass { color: var(--green); }
    .tri-state.fail { color: var(--danger); }
    .tri-state.unknown { color: var(--subtle); }

    .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .skill-card { background: var(--elevated); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
    .skill-card-name { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
    .skill-card-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

    /* ── SCREENING VIEW ── */
    .completion-badge {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
      background: rgba(255,255,255,0.06); color: var(--muted);
    }
    .lens-section { margin-bottom: 16px; }
    .lens-section:last-child { margin-bottom: 0; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: background 0.15s, border-color 0.15s;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); }

    /* ── OWNER PICKER (shared: Sourcing, Screening, IC) ── */
    .prospect-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .owner-picker { position: relative; display: flex; align-items: center; gap: 4px; }
    .owner-avatars { display: flex; }
    .owner-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--red);
      display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; color: var(--bg); margin-left: -6px;
      border: 1.5px solid var(--surface); flex-shrink: 0;
    }
    .owner-avatars .owner-avatar:first-child { margin-left: 0; }
    .owner-add-btn {
      width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.28); color: var(--muted); font-size: 13px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .owner-add-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.5); }
    .owner-menu {
      position: absolute; top: 26px; right: 0; z-index: 20; min-width: 140px;
      background: var(--surface); border: 1px solid var(--border-hover); border-radius: 10px;
      padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .owner-option {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer;
    }
    .owner-option:hover { background: rgba(255,255,255,0.06); }
    .owner-option .owner-avatar { margin-left: 0; }
    .owner-check { margin-left: auto; color: var(--green); font-weight: 700; }

    /* ── IC CHAT PANEL ── */
    .chat-window { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
    .chat-msg { max-width: 82%; display: flex; flex-direction: column; }
    .chat-msg.steve { align-self: flex-start; }
    .chat-msg.partner { align-self: flex-end; align-items: flex-end; }
    .chat-msg-from { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
    .chat-msg-text {
      font-size: 12.5px; line-height: 1.5; padding: 9px 12px; border-radius: 10px;
      background: var(--elevated); border: 1px solid var(--border); display: inline-block; text-align: left;
    }
    .chat-msg.steve .chat-msg-text { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }

    /* ── IC PARTNER VOTE WIDGET ── */
    .vote-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .vote-chip {
      font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); color: var(--text);
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .vote-chip:hover { background: rgba(255,255,255,0.1); }
    .vote-chip.voted { background: rgba(46,204,113,0.16); border-color: rgba(46,204,113,0.4); color: var(--green); }
    .vote-chip.pop { animation: chip-pop 0.35s ease; }
    @keyframes chip-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .vote-tally { font-size: 13px; color: var(--muted); }
    .vote-tally.reached { color: var(--green); font-weight: 600; }

    .confetti-burst { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute; top: -10px; width: 7px; height: 12px; opacity: 0.9;
      animation: confetti-fall 1.1s ease-in forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(220px) rotate(300deg); opacity: 0; }
    }

    /* ── DD EPIC TASK EDITOR ── */
    .dd-epic-section { margin-bottom: 14px; }
    .dd-epic-banner {
      display: flex; align-items: center; justify-content: center;
      width: calc(100% + 44px); margin: -20px -22px 14px -22px;
      height: 90px; font-size: 40px;
    }
    .dd-epic-banner.accent-red { background: rgba(192,57,43,0.14); }
    .dd-epic-banner.accent-red-light { background: rgba(224,76,62,0.14); }
    .dd-epic-banner.accent-green { background: rgba(46,204,113,0.14); }
    .dd-epic-banner.accent-blue { background: rgba(93,173,226,0.14); }
    .dd-epic-banner.accent-yellow { background: rgba(243,156,18,0.14); }
    .dd-task-row { display: flex; align-items: flex-start; gap: 8px; }
    .dd-task-row input[type="checkbox"] { margin-top: 5px; flex-shrink: 0; }
    .dd-task-row textarea {
      flex: 1; background: transparent; border: 1px solid transparent; color: var(--text);
      font-size: 12.5px; font-family: inherit; line-height: 1.45; padding: 4px 6px; border-radius: 6px;
      resize: none; overflow: hidden;
    }
    .dd-task-row textarea:hover, .dd-task-row textarea:focus {
      border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.03); outline: none;
    }
    .dd-task-row.done textarea { text-decoration: line-through; color: var(--muted); }
    .dd-task-delete {
      background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer;
      line-height: 1; padding: 2px 4px; flex-shrink: 0; margin-top: 5px;
    }

    /* ── KANBAN ── */

    .add-card-btn:disabled:hover { color: var(--muted); border-color: rgba(255,255,255,0.13); }
    .add-col-wrap { flex: 0 0 200px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
      display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto;
    }
    .fab-new-task {
      position: fixed; right: 28px; bottom: 28px; z-index: 150;

      transition: transform .15s, box-shadow .15s;
    }
    .fab-new-task:hover { background: var(--red-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,255,255,0.25); }
    .modal {

      color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px; margin-top: 5px;

    .modal-field-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-section-title { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 8px; }
    .checklist-item { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
    .checklist-item input[type=checkbox] { accent-color: var(--red); }
    .checklist-item.done span { text-decoration: line-through; color: var(--muted); }
    .inline-add-row { display: flex; gap: 6px; margin-top: 6px; }
    .inline-add-row input { flex: 1; margin-top: 0; }
    .inline-add-row button {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
      border-radius: 7px; padding: 0 12px; font-size: 12px; cursor: pointer;

    .comment-item { font-size: 12.5px; padding: 8px 10px; background: var(--elevated); border-radius: 7px; margin-bottom: 6px; line-height: 1.4; }
    .attachment-item { font-size: 12.5px; padding: 6px 10px; background: var(--elevated); border-radius: 7px; margin-bottom: 6px; color: var(--blue); }
    .move-select { margin-top: 4px; }

    /* ── CALENDAR ── */

    .cal-corner { background: var(--elevated); }

      background: var(--elevated); padding: 8px 6px; font-size: 10.5px; font-weight: 700;

    .cal-hours { display: flex; flex-direction: column; }

      .section-row, .workflow-grid, .engines, .modal-row { grid-template-columns: 1fr; }
    }

    /* ── Fund engine ── */

      font-size: 12px; padding: 8px 14px; border-radius: 8px; margin-bottom: 24px; }

        </div>
      `).join('');
    }

    function renderGrowKt(co) {
      co.kt.epics.forEach((e, i) => {
        const k = growKtKey(co.id, e.key);
        if (!(k in growKtOpen)) growKtOpen[k] = i === 0;
      });
      const cards = co.kt.epics.map(epic => {
        const isOpen = !!growKtOpen[growKtKey(co.id, epic.key)];
        return `
          <div class="grow-sec">
            <div class="grow-sec-header" id="grow-kt-header-${escapeAttr(co.id)}-${escapeAttr(epic.key)}"
              onclick="toggleGrowKt('${escapeAttr(co.id)}','${escapeAttr(epic.key)}')">
              ${growKtHeaderInner(co.id, epic)}
            </div>
            <div class="grow-sec-body${isOpen ? ' open' : ''}" id="grow-kt-body-${escapeAttr(co.id)}-${escapeAttr(epic.key)}">
              ${growKtBodyInner(co.id, epic)}
            </div>
          </div>
        `;
      }).join('');
      return `
        <div class="grow-subsec-label">Knowledge Transfer</div>
        <div class="grow-sections">${cards}</div>
      `;
    }

    // ── Grow: Playbooks & Skill Stacks ──
    function stackTagClass(tag) { return (tag || '').toLowerCase(); }
    function stackBarColor(tag) {
      const map = {
        Sales: 'rgba(46,204,113,0.55)', Marketing: 'rgba(243,156,18,0.5)', Recruitment: 'rgba(224,76,62,0.55)',
        Ops: 'rgba(93,173,226,0.55)', Finance: 'rgba(192,57,43,0.55)', Tech: 'rgba(255,255,255,0.25)'
      };
      return map[tag] || 'var(--border-hover)';
    }

    function growStacksAllFlat() {
      const out = [];
      DATA.grow.companies.forEach(co => (co.stacks || []).forEach(s => out.push({ stack: s, ownerCid: co.id, ownerName: co.name })));
      return out;
    }

    function growToolsAllFlat() {
      const out = [];
      DATA.grow.companies.forEach(co => (co.tools || []).forEach(t => out.push({ tool: t, ownerCid: co.id, ownerName: co.name })));
      return out;
    }

    function growFilterStacks(list, search, tag) {
      const q = (search || '').toLowerCase();
      return list.filter(({ stack }) => {
        if (tag && tag !== 'All' && stack.tag !== tag) return false;
        if (!q) return true;
        return stack.title.toLowerCase().includes(q) || stack.tag.toLowerCase().includes(q) || stack.outcome.toLowerCase().includes(q);
      });
    }

    function stackCardHtml(stack, ownerCid, ownerName, opts) {
      opts = opts || {};
      const viewingCid = opts.viewingCid || null;
      const wide = !!opts.wide;
      const bars = stack.steps.map(() => `<div class="stack-bar-seg" style="background:${stackBarColor(stack.tag)}"></div>`).join('');
      const reusedCount = stack.provenance.reusedAt.length;
      const provenance = `${escapeHtml(ownerName)} · ${escapeHtml(stack.provenance.date)} · reused at ${reusedCount} other compan${reusedCount === 1 ? 'y' : 'ies'}${stack.cloned ? ' · (clone)' : ''}`;
      let cloneBtn;
      if (viewingCid && ownerCid === viewingCid) {
        cloneBtn = `<button class="stack-btn" disabled>Already here</button>`;
      } else if (viewingCid) {
        const targetName = (DATA.grow.companies.find(c => c.id === viewingCid) || {}).name || 'this company';
        cloneBtn = `<button class="stack-btn primary" onclick="cloneStackToCompany('${escapeAttr(stack.id)}','${escapeAttr(ownerCid)}','${escapeAttr(viewingCid)}')">Clone to ${escapeHtml(targetName)}</button>`;
      } else {
        cloneBtn = `<button class="stack-btn primary" onclick="openCloneCompanyPicker('${escapeAttr(stack.id)}','${escapeAttr(ownerCid)}')">Clone…</button>`;
      }
      return `
        <div class="stack-card">
          <div class="stack-card-top">
            <span class="stack-tag ${stackTagClass(stack.tag)}">${escapeHtml(stack.tag)}</span>
            <span class="stack-steps-count">${stack.steps.length} steps</span>
          </div>
          <div class="stack-title">${escapeHtml(stack.title)}</div>
          <div class="stack-bar">${bars}</div>
          <div class="stack-outcome">${escapeHtml(stack.outcome)}</div>
          <div class="stack-provenance${wide ? ' wide' : ''}">${provenance}</div>
          <div class="stack-card-footer">
            <div class="stack-owner-updated">
              ${stack.owner ? `<span class="owner-avatar" title="${escapeAttr(stack.owner)}">${escapeHtml(PARTNER_INITIALS[stack.owner] || stack.owner[0])}</span>` : ''}
              <span class="stack-updated">updated ${escapeHtml(stack.updatedAt)}</span>
            </div>
            <div class="stack-actions">
              <button class="stack-btn" onclick="openViewStackModal('${escapeAttr(stack.id)}','${escapeAttr(ownerCid)}')">View Stack</button>
              ${cloneBtn}
            </div>
          </div>
        </div>
      `;
    }

    function growStackFilterBarHtml(scope, opts) {
      opts = opts || {};
      const search = growStackSearch[scope] || '';
      const activeTag = growStackTagFilter[scope] || 'All';
      const tags = ['All', ...STACK_TAGS];
      const chips = tags.map(t => `<button class="grow-tag-chip${t === activeTag ? ' active' : ''}" onclick="setStackTagFilter('${escapeAttr(scope)}','${escapeAttr(t)}')">${escapeHtml(t)}</button>`).join('');
      const portfolioToggle = opts.showPortfolioToggle ? `
        <span class="grow-portfolio-toggle" onclick="togglePortfolioWide('${escapeAttr(scope)}')">
          Search across portfolio
          <span class="grow-toggle-switch${growPortfolioWide[scope] ? ' on' : ''}"></span>
        </span>
      ` : '';
      const createCid = scope === 'stack-library' ? null : scope;
      return `
        <div class="grow-filter-bar" id="stack-filterbar-${escapeAttr(scope)}">
          <input type="text" class="grow-filter-search" placeholder="Search playbooks…" value="${escapeAttr(search)}"
            oninput="setStackSearch('${escapeAttr(scope)}', this.value)">
          ${chips}
          ${portfolioToggle}
          <button class="grow-request-tool-toggle" onclick="openCreateStackModal(${createCid ? `'${escapeAttr(createCid)}'` : 'null'})">+ Create New Stack</button>
        </div>
      `;
    }

    function growStackGridHtml(scope, co) {
      const wide = !!growPortfolioWide[co.id];
      const search = growStackSearch[scope] || '';
      const tag = growStackTagFilter[scope] || 'All';
      const pool = wide ? growStacksAllFlat() : (co.stacks || []).map(s => ({ stack: s, ownerCid: co.id, ownerName: co.name }));
      const filtered = growFilterStacks(pool, search, tag);
      const cards = filtered.map(({ stack, ownerCid, ownerName }) => stackCardHtml(stack, ownerCid, ownerName, { viewingCid: co.id, wide })).join('');
      const inner = filtered.length
        ? `<div class="stack-grid">${cards}</div>`
        : `<div class="grow-empty-state">${wide ? 'No playbooks match this search across the portfolio yet.' : 'No playbooks here yet — flip “Search across portfolio” to browse and clone one from another company.'}</div>`;
      return `<div id="stack-grid-${escapeAttr(scope)}">${inner}</div>`;
    }

    function growStackLibraryGridHtml() {
      const scope = 'stack-library';
      const search = growStackSearch[scope] || '';
      const tag = growStackTagFilter[scope] || 'All';
      const filtered = growFilterStacks(growStacksAllFlat(), search, tag);
      const cards = filtered.map(({ stack, ownerCid, ownerName }) => stackCardHtml(stack, ownerCid, ownerName, { wide: true })).join('');
      const inner = filtered.length ? `<div class="stack-grid">${cards}</div>` : `<div class="grow-empty-state">No playbooks match this search yet.</div>`;
      return `<div id="stack-grid-${scope}">${inner}</div>`;
    }

    function reRenderGrowStacksGridOnly(scope) {
      const grid = document.getElementById(`stack-grid-${scope}`);
      if (!grid) return;
      if (scope === 'stack-library') { grid.outerHTML = growStackLibraryGridHtml(); return; }
      const co = DATA.grow.companies.find(c => c.id === scope);
      if (co) grid.outerHTML = growStackGridHtml(scope, co);
    }

    function reRenderGrowStacksScope(scope) {
      const bar = document.getElementById(`stack-filterbar-${scope}`);
      if (bar) bar.outerHTML = growStackFilterBarHtml(scope, { showPortfolioToggle: scope !== 'stack-library' });
      reRenderGrowStacksGridOnly(scope);
    }

    function setStackSearch(scope, val) {
      growStackSearch[scope] = val;
      reRenderGrowStacksGridOnly(scope);
    }
    function setStackTagFilter(scope, tag) {
      growStackTagFilter[scope] = tag;
      reRenderGrowStacksScope(scope);
    }
    function togglePortfolioWide(cid) {
      growPortfolioWide[cid] = !growPortfolioWide[cid];
      reRenderGrowStacksScope(cid);
    }

    function renderGrowStacksSection(co) {
      return `
        <div class="grow-subsec-label">Playbooks & Skill Stacks<span class="grow-subsec-count">${(co.stacks || []).length}</span></div>
        ${growStackFilterBarHtml(co.id, { showPortfolioToggle: true })}
        ${growStackGridHtml(co.id, co)}
      `;
    }

    // ── Grow: View Stack + Clone modals (shared #modal-overlay pattern) ──
    function findStackAnywhere(stackId) {
      for (const co of DATA.grow.companies) {
        const s = (co.stacks || []).find(s => s.id === stackId);
        if (s) return { stack: s, ownerCid: co.id, ownerName: co.name };
      }
      return null;
    }

    function ensureModalOverlay() {
      let overlay = document.getElementById('modal-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'modal-overlay';
        overlay.className = 'modal-overlay';
        document.body.appendChild(overlay);
      }
      return overlay;
    }

    function openViewStackModal(stackId, ownerCid) {
      growViewingStack = { stackId, ownerCid };
      const overlay = ensureModalOverlay();
      overlay.innerHTML = stackModalHtml();
      overlay.onclick = (e) => { if (e.target === overlay) closeViewStackModal(); };
      overlay.style.display = 'flex';
    }

    function stackModalHtml() {
      if (!growViewingStack) return '';
      const found = findStackAnywhere(growViewingStack.stackId);
      if (!found) return '';
      const { stack, ownerCid, ownerName } = found;
      return growStackEditMode[stack.id] ? stackModalEditHtml(stack, ownerCid) : stackModalLockedHtml(stack, ownerCid, ownerName);
    }

    function stackListSectionHtml(items, emptyLabel) {
      return (items && items.length) ? items.map(t => `
        <div class="stack-modal-template">${t.url ? `<a href="${escapeAttr(t.url)}" target="_blank" rel="noopener">${escapeHtml(t.label)}</a>` : `${escapeHtml(t.label)} <span class="none">— No link yet</span>`}</div>
      `).join('') : `<div class="stack-modal-template"><span class="none">${emptyLabel}</span></div>`;
    }

    function stackModalLockedHtml(stack, ownerCid, ownerName) {
      const steps = stack.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('');
      const reusedCount = stack.provenance.reusedAt.length;
      const estimateLine = stack.setupEstimate != null ? `⏱ ~${stack.setupEstimate}h to set up` : `⏱ Not estimated yet`;
      return `
        <div class="modal">
          <button class="modal-close" onclick="closeViewStackModal()">×</button>
          <button class="stack-lock-toggle" onclick="toggleStackEditMode('${escapeAttr(stack.id)}')" title="Unlock to edit">🔒</button>
          <div class="modal-section-title" style="margin-top:0;">${escapeHtml(stack.title)}</div>
          <div class="stack-provenance" style="margin-bottom:6px;">${escapeHtml(ownerName)} · ${escapeHtml(stack.provenance.date)} · reused at ${reusedCount} other compan${reusedCount === 1 ? 'y' : 'ies'}</div>
          <div class="stack-setup-estimate">${estimateLine}</div>
          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:14px 0 8px;">Instructions</div>
          <ol class="stack-modal-steps">${steps}</ol>
          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:0 0 8px;">Templates</div>
          <div class="stack-modal-templates">${stackListSectionHtml(stack.templates, 'No templates yet')}</div>
          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:0 0 8px;">Apps</div>
          <div class="stack-modal-templates">${stackListSectionHtml(stack.apps, 'No apps yet')}</div>
          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:0 0 8px;">Links</div>
          <div class="stack-modal-templates">${stackListSectionHtml(stack.links, 'No links yet')}</div>
          <div class="stack-modal-footer">
            <button class="stack-btn" onclick="closeViewStackModal()">Close</button>
            <button class="stack-btn primary" onclick="openStackSetupPicker('${escapeAttr(stack.id)}')">🚀 Setup Stack</button>
            <button class="stack-btn primary" onclick="openCloneCompanyPicker('${escapeAttr(stack.id)}','${escapeAttr(ownerCid)}')">Clone…</button>
          </div>
        </div>
      `;
    }

    function stackEditInstructionsInner(stack) {
      const rows = stack.steps.map((s, i) => `
        <div class="stack-edit-row">
          <input type="text" value="${escapeAttr(s)}" oninput="updateStackInstruction('${escapeAttr(stack.id)}', ${i}, this.value)" placeholder="Instruction ${i + 1}">
          <button class="stack-edit-remove" onclick="removeStackInstruction('${escapeAttr(stack.id)}', ${i})">×</button>
        </div>
      `).join('');
      return rows + `<button class="stack-edit-add" onclick="addStackInstruction('${escapeAttr(stack.id)}')">+ Add instruction</button>`;
    }

    const STACK_LIST_LABELS = {
      templates: { field: 'Template name', add: '+ Add template' },
      apps: { field: 'App name', add: '+ Add app' },
      links: { field: 'Link title', add: '+ Add link' }
    };

    function stackEditListInner(stack, listKey) {
      const items = stack[listKey] || [];
      const labels = STACK_LIST_LABELS[listKey];
      const rows = items.map((item, i) => `
        <div class="stack-edit-row">
          <input type="text" value="${escapeAttr(item.label)}" oninput="updateStackListItem('${escapeAttr(stack.id)}','${listKey}',${i},'label',this.value)" placeholder="${labels.field}">
          <input type="text" value="${escapeAttr(item.url || '')}" oninput="updateStackListItem('${escapeAttr(stack.id)}','${listKey}',${i},'url',this.value)" placeholder="https://…">
          <button class="stack-edit-remove" onclick="removeStackListItem('${escapeAttr(stack.id)}','${listKey}',${i})">×</button>
        </div>
      `).join('');
      return rows + `<button class="stack-edit-add" onclick="addStackListItem('${escapeAttr(stack.id)}','${listKey}')">${labels.add}</button>`;
    }

    function stackModalEditHtml(stack, ownerCid) {
      return `
        <div class="modal">
          <button class="modal-close" onclick="closeViewStackModal()">×</button>
          <button class="stack-lock-toggle" onclick="toggleStackEditMode('${escapeAttr(stack.id)}')" title="Lock — done editing">🔓</button>
          <div class="modal-field">
            <input type="text" value="${escapeAttr(stack.title)}" oninput="updateStackField('${escapeAttr(stack.id)}','title',this.value)" placeholder="Stack title" style="font-size:16px; font-weight:600; margin-top:0;">
          </div>
          <div class="modal-row">
            <div class="modal-field">
              <div class="modal-field-label">Category</div>
              <select onchange="updateStackField('${escapeAttr(stack.id)}','tag',this.value)">
                ${STACK_TAGS.map(t => `<option value="${escapeAttr(t)}" ${t === stack.tag ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
              </select>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Setup estimate (hours)</div>
              <input type="number" min="0" step="0.5" value="${stack.setupEstimate ?? ''}" oninput="updateStackField('${escapeAttr(stack.id)}','setupEstimate',this.value)">
            </div>
          </div>
          <div class="modal-field">
            <div class="modal-field-label">Outcome</div>
            <input type="text" value="${escapeAttr(stack.outcome)}" oninput="updateStackField('${escapeAttr(stack.id)}','outcome',this.value)" placeholder="What does this achieve?">
          </div>

          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:18px 0 8px;">Instructions</div>
          <div id="stack-edit-instructions-${escapeAttr(stack.id)}">${stackEditInstructionsInner(stack)}</div>

          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:18px 0 8px;">Templates</div>
          <div id="stack-edit-templates-${escapeAttr(stack.id)}">${stackEditListInner(stack, 'templates')}</div>

          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:18px 0 8px;">Apps</div>
          <div id="stack-edit-apps-${escapeAttr(stack.id)}">${stackEditListInner(stack, 'apps')}</div>

          <div class="grow-subsec-label" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:18px 0 8px;">Links</div>
          <div id="stack-edit-links-${escapeAttr(stack.id)}">${stackEditListInner(stack, 'links')}</div>

          <div class="stack-modal-footer">
            <button class="stack-btn" onclick="closeViewStackModal()">Close</button>
            <button class="stack-btn primary" onclick="openStackSetupPicker('${escapeAttr(stack.id)}')">🚀 Setup Stack</button>
            <button class="stack-btn primary" onclick="openCloneCompanyPicker('${escapeAttr(stack.id)}','${escapeAttr(ownerCid)}')">Clone…</button>
          </div>
        </div>
      `;
    }

    function toggleStackEditMode(stackId) {
      growStackEditMode[stackId] = !growStackEditMode[stackId];
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.innerHTML = stackModalHtml();
    }

    function updateStackField(stackId, field, value) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack[field] = field === 'setupEstimate' ? (value === '' ? null : parseFloat(value)) : value;
    }

    function updateStackInstruction(stackId, idx, value) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack.steps[idx] = value;
    }

    function addStackInstruction(stackId) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack.steps.push('');
      reRenderStackEditSection(stackId, 'instructions');
    }

    function removeStackInstruction(stackId, idx) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack.steps.splice(idx, 1);
      reRenderStackEditSection(stackId, 'instructions');
    }

    function updateStackListItem(stackId, listKey, idx, field, value) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack[listKey][idx][field] = value;
    }

    function addStackListItem(stackId, listKey) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack[listKey] = found.stack[listKey] || [];
      found.stack[listKey].push({ label: '', url: '' });
      reRenderStackEditSection(stackId, listKey);
    }

    function removeStackListItem(stackId, listKey, idx) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      found.stack[listKey].splice(idx, 1);
      reRenderStackEditSection(stackId, listKey);
    }

    function reRenderStackEditSection(stackId, key) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      const el = document.getElementById(`stack-edit-${key}-${stackId}`);
      if (!el) return;
      el.innerHTML = key === 'instructions' ? stackEditInstructionsInner(found.stack) : stackEditListInner(found.stack, key);
    }

    function closeViewStackModal() {
      if (growStackDraftId) {
        const found = findStackAnywhere(growStackDraftId);
        if (found && !found.stack.title.trim()) {
          const co = DATA.grow.companies.find(c => c.id === found.ownerCid);
          if (co) co.stacks = co.stacks.filter(s => s.id !== growStackDraftId);
        }
        growStackDraftId = null;
      }
      growViewingStack = null;
      const overlay = document.getElementById('modal-overlay');
      if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; overlay.onclick = null; }
    }

    function openCloneCompanyPicker(stackId, ownerCid) {
      growCloneStack = { stackId, ownerCid };
      const overlay = ensureModalOverlay();
      overlay.innerHTML = cloneCompanyPickerHtml();
      overlay.onclick = (e) => { if (e.target === overlay) closeCloneCompanyPicker(); };
      overlay.style.display = 'flex';
    }

    function cloneCompanyPickerHtml() {
      if (!growCloneStack) return '';
      const opts = DATA.grow.companies.map(co => `
        <button class="company-picker-opt" onclick="cloneStackToCompany('${escapeAttr(growCloneStack.stackId)}','${escapeAttr(growCloneStack.ownerCid)}','${escapeAttr(co.id)}')" ${co.id === growCloneStack.ownerCid ? 'disabled' : ''}>${escapeHtml(co.name)}${co.id === growCloneStack.ownerCid ? ' (source)' : ''}</button>
      `).join('');
      return `
        <div class="modal">
          <button class="modal-close" onclick="closeCloneCompanyPicker()">×</button>
          <div class="modal-section-title" style="margin-top:0;">Clone playbook to…</div>
          <div class="company-picker-list">${opts}</div>
        </div>
      `;
    }

    function closeCloneCompanyPicker() {
      growCloneStack = null;
      const overlay = document.getElementById('modal-overlay');
      if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; overlay.onclick = null; }
    }

    function openStackSetupPicker(stackId) {
      growSetupStackFor = stackId;
      const overlay = ensureModalOverlay();
      overlay.innerHTML = stackSetupPickerHtml();
      overlay.onclick = (e) => { if (e.target === overlay) closeStackSetupPicker(); };
      overlay.style.display = 'flex';
    }

    function stackSetupPickerHtml() {
      if (!growSetupStackFor) return '';
      const opts = PARTNERS.map(p => `
        <button class="company-picker-opt" onclick="pushStackToKanban('${escapeAttr(growSetupStackFor)}','${escapeAttr(p)}')">
          <span class="owner-avatar" title="${escapeAttr(p)}">${escapeHtml(PARTNER_INITIALS[p] || p[0])}</span>
          ${escapeHtml(p)}
        </button>
      `).join('');
      return `
        <div class="modal">
          <button class="modal-close" onclick="closeStackSetupPicker()">×</button>
          <div class="modal-section-title" style="margin-top:0;">Assign "Setup Stack" to…</div>
          <div class="company-picker-list">${opts}</div>
        </div>
      `;
    }

    function closeStackSetupPicker() {
      growSetupStackFor = null;
      const overlay = document.getElementById('modal-overlay');
      if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; overlay.onclick = null; }
    }

    function pushStackToKanban(stackId, owner) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      const { stack } = found;
      kanban.cards.push({
        id: nextKanbanId(),
        title: `Set up: ${stack.title}`,
        column: 'To Do',
        deadline: '',
        estimate: stack.setupEstimate,
        owner,
        engine: 'grow',
        goal: ROADMAP_GOALS[0],
        desc: stack.outcome,
        checklist: stack.steps.map(s => ({ text: s, done: false })),
        comments: [],
        attachments: [
          ...(stack.templates || []).map(t => `${t.label}${t.url ? ' — ' + t.url : ''}`),
          ...(stack.apps || []).map(a => `${a.label}${a.url ? ' — ' + a.url : ''}`),
          ...(stack.links || []).map(l => `${l.label}${l.url ? ' — ' + l.url : ''}`)
        ]
      });
      closeStackSetupPicker();
      closeViewStackModal();
      render();
    }

    function cloneStackToCompany(stackId, fromCid, toCid) {
      const found = findStackAnywhere(stackId);
      if (!found) return;
      const { stack, ownerCid } = found;
      if (ownerCid === toCid) return;
      const toCo = DATA.grow.companies.find(c => c.id === toCid);
      if (!toCo) return;
      growStackIdCounter++;
      const clone = JSON.parse(JSON.stringify(stack));
      clone.id = `stack-${growStackIdCounter}`;
      clone.provenance = { company: stack.provenance.company, date: stack.provenance.date, reusedAt: [] };

      toCo.stacks.push(clone);
      if (!stack.provenance.reusedAt.includes(toCid)) stack.provenance.reusedAt.push(toCid);

      closeCloneCompanyPicker();

        ? `<a class="tool-link" href="${escapeAttr(tool.url)}" target="_blank" rel="noopener">${escapeHtml(tool.url.replace(/^https?:\/\//, ''))}</a>`

        <div class="tool-card">
          <div class="tool-card-top">
            <div>
              <div class="tool-type">${escapeHtml(tool.type)}</div>
              <div class="tool-name">${escapeHtml(tool.name)}</div>
            </div>
            <span class="tool-status ${escapeAttr(tool.status)}">${escapeHtml(tool.status)}</span>
          </div>
          ${link}
          ${opts.ownerName ? `<div class="tool-provenance">${escapeHtml(opts.ownerName)}</div>` : ''}

            ${tool.devOwner ? `<span class="owner-avatar" title="${escapeAttr(tool.devOwner)}">${escapeHtml(PARTNER_INITIALS[tool.devOwner] || tool.devOwner[0])}</span>` : `<span></span>`}

      const cards = (co.tools || []).map(t => toolCardHtml(t)).join('');

      return `<div id="tool-grid-${escapeAttr(cid)}">${inner}</div>`;
    }

    function growFilterTools(list, search) {
      const q = (search || '').toLowerCase();
      if (!q) return list;
      return list.filter(({ tool, ownerName }) =>
        tool.name.toLowerCase().includes(q) || tool.type.toLowerCase().includes(q) || ownerName.toLowerCase().includes(q));
    }

    function growToolLibraryGridHtml() {
      const filtered = growFilterTools(growToolsAllFlat(), growToolLibrarySearch);
      const cards = filtered.map(({ tool, ownerName }) => toolCardHtml(tool, { ownerName })).join('');

      const grid = document.getElementById(`tool-grid-${escapeAttr(cid)}`);

      const co = DATA.grow.companies.find(c => c.id === cid);

      const co = DATA.grow.companies.find(c => c.id === cid);

      growToolIdCounter++;

      if (wrap) wrap.outerHTML = growToolRequestWrapHtml(cid);
    }

    function checkDuplicateTool(cid, text) {
      if (!text.trim()) return null;
      const pool = cid === 'library' ? growToolsAllFlat().map(x => x.tool) : ((DATA.grow.companies.find(c => c.id === cid) || {}).tools || []);
      const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 3);
      if (!words.length) return null;
      const match = pool.find(t => words.some(w => t.name.toLowerCase().includes(w)));
      return match ? match.name : null;
    }

    function onToolRequestInput(cid) {
      const desc = (document.getElementById(`tool-req-desc-${cid}`) || {}).value || '';
      const dup = checkDuplicateTool(cid, desc);
      const warnEl = document.getElementById(`tool-req-warn-${cid}`);
      if (warnEl) warnEl.innerHTML = dup ? `<div class="grow-request-warn">Similar tool exists: ${escapeHtml(dup)} — review before submitting.</div>` : '';
    }

    function submitToolRequest(cid) {
      const targetCid = cid === 'library' ? (document.getElementById(`tool-req-company-${cid}`) || {}).value : cid;
      const co = DATA.grow.companies.find(c => c.id === targetCid);
      if (!co) return;
      const descEl = document.getElementById(`tool-req-desc-${cid}`);
      const desc = descEl ? descEl.value : '';
      const areaEl = document.getElementById(`tool-req-area-${cid}`);
      const area = areaEl ? areaEl.value : 'Other';
      const urgencyEl = document.querySelector(`input[name="tool-req-urgency-${cid}"]:checked`);
      const urgency = urgencyEl ? urgencyEl.value : 'medium';
      if (!desc.trim()) return;
      growToolIdCounter++;
      if (!co.tools) co.tools = [];
      co.tools.push({
        id: `tool-${growToolIdCounter}`, name: desc.trim().slice(0, 60), type: area,
        status: 'in-dev', url: null, devOwner: null, reusedAt: [], urgency
      });
      growToolFormOpen[cid] = false;
      growToolConfirmMsg[cid] = 'Submitted — added to backlog.';
      refreshToolGrid(cid);
      const count = document.getElementById(`tools-count-${cid}`);
      if (count) count.textContent = co.tools.length;
      const wrap = document.getElementById(`tool-request-wrap-${cid}`);
      if (wrap) wrap.outerHTML = growToolRequestWrapHtml(cid);

    function ddAssignCandidates() {
      const ic = DATA.findStages.find(s => s.key === 'ic');
      const screening = DATA.findStages.find(s => s.key === 'screening');
      return [
        ...ic.leads.filter(l => !l.inDD).map(l => ({ stage: 'ic', lead: l })),
        ...screening.leads.filter(l => !l.inDD).map(l => ({ stage: 'screening', lead: l }))
      ];
    }

    function assignLeadToDD(stageKey, leadId) {
      const dd = DATA.findStages.find(s => s.key === 'dd');
      const src = DATA.findStages.find(s => s.key === stageKey);
      if (!src) return;
      const lead = src.leads.find(l => l.id === leadId);
      if (!lead || lead.inDD) return;
      lead.inDD = true;
      lead.pushedToWall = false;
      lead.ddPromptShown = false;
      lead.ddOutcome = null;
      dd.leads.push(lead);
      dd.count = dd.leads.length;
      render();
    }

      if (stageKey === 'sourcing') return s.prospects.find(x => x.id === itemId);
      if (stageKey === 'screening') return s.leads.find(x => x.id === itemId);
      if (stageKey === 'ic') return s.leads.find(x => x.id === itemId);
      if (stageKey === 'dd') return s.leads.find(x => x.id === itemId);
      return null;

      renderNav(parts);
      const app = document.getElementById('app');

      if (parts.length === 0) {
        app.innerHTML = renderCompany();
        renderCalendar();
      } else if (parts[0] === 'find' && parts.length === 1) {
        app.innerHTML = renderFind();
      } else if (parts[0] === 'find' && parts.length === 2) {
        app.innerHTML = renderWorkflow(parts[1]);
      } else if (parts[0] === 'find' && parts.length === 4 && parts[2] === 'task') {
        app.innerHTML = parts[1] === 'sourcing' ? renderProspectTask(parts[3])
          : parts[1] === 'screening' ? renderScreeningTask(parts[3])
          : parts[1] === 'ic' ? renderICTask(parts[3])
          : renderTask(parts[1], parts[3]);
        if (parts[1] === 'ic' && icCalendarVisible) renderCalendar();
      } else if (parts[0] === 'fund' && parts.length === 3 && parts[1] === 'company') {
        app.innerHTML = renderFundCompany(parts[2]);
      } else if (parts[0] === 'fund' && parts[1] === 'investors') {
        app.innerHTML = renderInvestorCRM();
      } else if (parts[0] === 'fund') {
        app.innerHTML = renderFund();
      } else if (parts[0] === 'grow' && parts.length === 3 && parts[1] === 'company') {
        app.innerHTML = renderGrowCompany(parts[2]);
      } else if (parts[0] === 'grow' && parts.length === 2 && parts[1] === 'stack-library') {
        app.innerHTML = renderStackLibrary();
      } else if (parts[0] === 'grow') {
        app.innerHTML = renderGrow();
      } else {
        app.innerHTML = renderCompany();
        renderCalendar();
      }
      window.scrollTo(0, 0);
    }

    function renderNav(parts) {
      const links = [
        { path: '/', label: 'Home', match: parts.length === 0 },

        { path: '/fund', label: 'Fund', match: parts[0] === 'fund' },
        { path: '/grow', label: 'Grow', match: parts[0] === 'grow' }
      ];
      document.getElementById('nav-links').innerHTML = links.map(l =>
        `<button class="nav-link${l.match ? ' active' : ''}" onclick="navigate('${l.path}')">${l.label}</button>`
      ).join('');
      document.getElementById('nav-date').textContent = 'Tue, 28 Jul 2026';
    }

    function crumbs(items) {
      return `<div class="crumbs">` + items.map((item, i) => {
        const isLast = i === items.length - 1;
        const sep = i > 0 ? `<span class="sep">/</span>` : '';
        if (isLast) return `${sep}<span class="current">${item.label}</span>`;
        return `${sep}<button onclick="navigate('${item.path}')">${item.label}</button>`;
      }).join('') + `</div>`;
    }

    function ddFocusLine() {
      const dd = DATA.findStages.find(s => s.key === 'dd');
      const lead = dd.leads[0];
      if (!lead) return "💸 Auran Pesupojat Oy — Due Diligence / financing close (Momentum Helsinki engagement)";
      if (lead.ddOutcome === 'proceeding') return "💸 Auran Pesupojat Oy — Due Diligence complete, proceeding to Fund financing";
      if (lead.ddOutcome === 'paused') return "💸 Auran Pesupojat Oy — Due Diligence complete, on hold";
      if (lead.pushedToWall) {
        const ddCards = kanban.cards.filter(c => c.ddDeal === lead.id);
        const allDone = ddCards.length > 0 && ddCards.every(c => c.column === 'Done');
        if (allDone) return "💸 Auran Pesupojat Oy — Due Diligence complete, awaiting Fund decision";
        return "💸 Auran Pesupojat Oy — Due Diligence in progress on the Task Board";
      }
      return "💸 Auran Pesupojat Oy — in Due Diligence, tasks not yet on the Task Board";
    }

    // ── KANBAN RENDER ──
    function engineTagClass(engine) {
      return engine === 'find' ? 'engine-find' : engine === 'fund' ? 'engine-fund' : 'engine-grow';
    }
    function initials(name) {
      return (name || '?').split(/[\s,]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }
    function fmtDeadline(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${days[d.getDay()]} ${d.getDate()}.${d.getMonth()+1} ${hh}:${mm}`;
    }

    function renderKanban() {
      const root = document.getElementById('kanban-root');
      if (!root) return;

      const cols = kanban.columns.map(col => {
        const cards = kanban.cards.filter(c => c.column === col);
        const cardsHtml = cards.map(c => {
          const dl = fmtDeadline(c.deadline);
          return `
            <div class="kanban-card" onclick="openCard('${c.id}')">
              <div class="kanban-card-title">${escapeHtml(c.title)}</div>
              <div class="record-hint"><span class="dot"></span> 🎥 Record instructions</div>
              <div class="kanban-card-tags">
                <span class="kc-tag ${engineTagClass(c.engine)}">${c.engine}</span>
                <span class="kc-tag goal">${escapeHtml(c.goal || 'No goal')}</span>
                ${c.ddDealName ? `<span class="kc-tag dd-deal">${escapeHtml(c.ddDealName)}</span>` : ''}
                ${c.ddEpic ? `<span class="kc-tag dd-epic">${escapeHtml(c.ddEpic)}</span>` : ''}
              </div>
              <div class="kanban-card-meta">
                <span>${dl ? dl + (c.estimate ? ' · ' + c.estimate + 'h' : '') : 'No deadline'}</span>
                <span class="kanban-card-owner">${initials(c.owner)}</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="kanban-column">
            <div class="kanban-col-header">
              <div class="kanban-col-title">${escapeHtml(col)}</div>
              <div class="kanban-col-count">${cards.length}</div>
            </div>
            <div class="kanban-cards">${cardsHtml}</div>
            <button class="add-card-btn" onclick="addCard('${escapeAttr(col)}')">+ Add card</button>
          </div>
        `;
      }).join('');

      root.innerHTML = `
        <div class="kanban-board">
          ${cols}
          <div class="add-col-wrap">
            <button class="add-col-btn" onclick="addColumn()">+ Add column</button>
          </div>
        </div>
      `;
    }

      const title = prompt("Card title:");

      kanban.cards.push({

        deadline: "", estimate: null, owner: "",
        engine: "find", goal: ROADMAP_GOALS[0],

      const c = findCard(id);
      if (!c) return;
      let overlay = document.getElementById('modal-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'modal-overlay';
        overlay.className = 'modal-overlay';
        overlay.onclick = (e) => { if (e.target === overlay) closeCard(); };
        document.body.appendChild(overlay);
      }
      overlay.innerHTML = renderCardModal(c);
      overlay.style.display = 'flex';

    function closeCard() {
      if (kanbanDraftId) {
        const draft = findCard(kanbanDraftId);
        if (draft && !draft.title.trim()) {
          kanban.cards = kanban.cards.filter(c => c.id !== kanbanDraftId);
        }
        kanbanDraftId = null;
      }
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.style.display = 'none';
      renderKanban();
      renderCalendar();

    }

    // ── CALENDAR RENDER ──
    const CAL_START_HOUR = 6;
    const CAL_END_HOUR = 22;

    function weekDates() {
      const today = new Date();
      const day = today.getDay(); // 0=Sun
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = new Date(today);
      monday.setDate(today.getDate() + mondayOffset);
      monday.setHours(0,0,0,0);
      return Array.from({length:7}, (_,i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });
    }

    function sameDay(a, b) {
      return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }

    function renderCalendar() {
      const root = document.getElementById('calendar-root');
      if (!root) return;

      const days = weekDates();
      const today = new Date();
      const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      const hourLabels = [];
      for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) {
        hourLabels.push(`<div class="cal-hour-label">${h}:00</div>`);
      }

      const dayHeaders = days.map((d,i) =>
        `<div class="cal-day-header${sameDay(d,today) ? ' today' : ''}">${dayLabels[i]} ${d.getDate()}</div>`
      ).join('');

      const totalHeight = (CAL_END_HOUR - CAL_START_HOUR) * 44;

      const dayCols = days.map(d => {
        const hourCells = [];
        for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) hourCells.push(`<div class="cal-hour-cell"></div>`);

        const blocks = kanban.cards.filter(c => {
          if (!c.deadline || !c.estimate) return false;
          const dl = new Date(c.deadline);
          return sameDay(dl, d);
        }).map(c => {
          const dl = new Date(c.deadline);
          const endMins = (dl.getHours() - CAL_START_HOUR) * 60 + dl.getMinutes();
          const startMins = endMins - (c.estimate * 60);
          const clampedStart = Math.max(0, startMins);
          const top = (clampedStart / 60) * 44;
          const height = Math.max(18, ((endMins - clampedStart) / 60) * 44);
          const hh = String(dl.getHours()).padStart(2,'0');
          const mm = String(dl.getMinutes()).padStart(2,'0');
          return `
            <div class="cal-block" style="top:${top}px; height:${height}px;" onclick="highlightCard('${c.id}')" title="${escapeAttr(c.title)}">
              <strong>${escapeHtml(c.title)}</strong>${c.estimate}h · due ${hh}:${mm}
            </div>
          `;
        }).join('');

        return `<div class="cal-day-col" style="height:${totalHeight}px;">${hourCells.join('')}${blocks}</div>`;
      }).join('');

      root.innerHTML = `
        <div class="calendar-grid">
          <div class="cal-corner"></div>
          ${dayHeaders}
          <div class="cal-hours">${hourLabels.join('')}</div>
          ${dayCols}
        </div>
      `;

      renderKanban();
    }

    const IC_VOTE_THRESHOLD = 3;
    let icLastToggledPartner = null; // one-shot: which chip should play the pop animation on this render
    let icCelebrationPending = false; // one-shot: whether to render a confetti burst on this render

    function toggleICVote(leadId, partner) {
      const s = DATA.findStages.find(x => x.key === 'ic');
      const lead = s.leads.find(x => x.id === leadId);
      if (!lead) return;
      const idx = lead.votes.indexOf(partner);
      if (idx === -1) lead.votes.push(partner); else lead.votes.splice(idx, 1);
      icLastToggledPartner = partner;
      if (lead.votes.length >= IC_VOTE_THRESHOLD && !lead.celebrated) {
        lead.celebrated = true;
        lead.chat.push({ from: 'steve', text: "🎉 3/4 — we're in! I'll start prepping the DD kickoff checklist for Auran Pesupojat." });
        icCelebrationPending = true;
        assignLeadToDD('ic', lead.id);
      }
      render();
    }

    function renderConfettiBurst() {
      const colors = ['#e04c3e', '#f39c12', '#2ecc71', '#5dade2'];
      const pieces = Array.from({ length: 24 }, (_, i) => {
        const left = Math.round(Math.random() * 100);
        const delay = (Math.random() * 0.3).toFixed(2);
        return `<div class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; background:${colors[i % colors.length]};"></div>`;
      }).join('');
      return `<div class="confetti-burst">${pieces}</div>`;
    }

    function renderICVoteWidget(lead) {
      const chips = PARTNERS.map(p => {
        const voted = lead.votes.includes(p);
        const justToggled = icLastToggledPartner === p;
        return `<button class="vote-chip ${voted ? 'voted' : ''}${justToggled ? ' pop' : ''}" onclick="toggleICVote('${lead.id}','${p}')">${voted ? '✓ ' : ''}${p}</button>`;
      }).join('');
      icLastToggledPartner = null;

      const tally = lead.votes.length;
      const reached = tally >= IC_VOTE_THRESHOLD;

      const showConfetti = icCelebrationPending;
      icCelebrationPending = false;

      return `
        <div class="card static card-pad" style="margin-top:16px; position:relative; overflow:hidden;">

          <div class="fund-stat-tile">
            <div class="fund-stat-label">Exit scenarios</div>
            <div class="fund-stat-value" style="color:var(--subtle);">${a.exitScenarios.value || '—'}</div>
            <div class="fund-stat-sub">${escapeHtml(a.exitScenarios.note)}</div>
          </div>
          <div class="fund-stat-tile">
            <div class="fund-stat-label">Management fees collected</div>
            <div class="fund-stat-value">€${mgmtFeeTotal.toLocaleString('en-US')}/mo</div>
            <div class="fund-stat-sub">= Askel revenue — Melers Oy only for now</div>
          </div>
          <div class="fund-stat-tile">
            <div class="fund-stat-label">EBITDA</div>
            <div class="fund-stat-value" style="color:var(--subtle);">${a.ebitda.value || '—'}</div>
            <div class="fund-stat-sub">${escapeHtml(a.ebitda.note)}</div>
          </div>
        </div>

        <div class="sec-label">Portfolio companies — bottom level</div>
        <div class="fund-portfolio-row">
          ${pfCards}
          ${lockedCards}
        </div>
      `;
    }

    function editFundLiquidityRow(companyId, idx, value) {
      const p = DATA.fund.portfolio.find(x => x.id === companyId);
      if (!p || !p.liquiditySnapshot) return;
      p.liquiditySnapshot.rows[idx].value = value;
    }

    function renderFundCompany(id) {
      const p = DATA.fund.portfolio.find(x => x.id === id);
      if (!p) return renderFund();

      const liquidityHtml = p.liquiditySnapshot ? `
        <div class="card static card-pad" style="margin-top:16px;">
          <div class="sec-label">📊 Monthly Liquidity Snapshot <span class="tag-example">${escapeHtml(p.liquiditySnapshot.month)} — illustrative demo month, in-session editable</span></div>
          ${p.liquiditySnapshot.rows.map((r, idx) => `
            <div class="fund-liquidity-row">
              <span class="l">${escapeHtml(r.label)}</span>
              <input type="text" value="${escapeAttr(r.value)}" onchange="editFundLiquidityRow('${p.id}',${idx},this.value)">
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="card static card-pad" style="margin-top:16px;">
          <div class="sec-label">📊 Monthly Liquidity Snapshot</div>
          <div class="empty-note">Not available yet — deal hasn't closed.</div>
        </div>
      `;

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Fund', path: '/fund' }, { label: p.name }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">${escapeHtml(p.name)}</div>
          <div class="greeting-sub">Portfolio company financial detail</div>
        </div>

        <div style="max-width:640px;">
          <div class="card static card-pad">
            <div class="fund-pf-name" style="font-size:15px; margin-bottom:10px;"><span class="fund-pf-dot ${p.status === 'ok' ? 'green' : 'red'}"></span>${escapeHtml(p.name)}</div>
            <div class="field-row"><div class="field-label">Revenue</div><div class="field-value">${escapeHtml(p.revenue)}</div></div>
            <div class="field-row"><div class="field-label">Profit</div><div class="field-value">${escapeHtml(p.profit)}</div></div>
            <div class="field-row"><div class="field-label">Bank loan</div><div class="field-value">${escapeHtml(p.loan)}</div></div>
            <div class="field-row"><div class="field-label">Seller financing</div><div class="field-value">${escapeHtml(p.sellerFinancing)}</div></div>
            <div class="field-row"><div class="field-label">Management fee</div><div class="field-value">${escapeHtml(p.managementFee)}</div></div>
          </div>

          <div class="card static card-pad" style="margin-top:16px;">
            <div class="sec-label">Basic terms</div>
            <div class="fund-terms-row"><span class="l">Loan repayment term</span><span class="v">${escapeHtml(p.loanTerms.term)}</span></div>
            <div class="fund-terms-row"><span class="l">Monthly loan repayment</span><span class="v">${escapeHtml(p.loanTerms.monthlyRepayment)}</span></div>
            <div class="fund-terms-row"><span class="l">Seller financing amount</span><span class="v">${escapeHtml(p.loanTerms.sellerFinancingAmount)}</span></div>
            <div class="fund-terms-row"><span class="l">Seller financing schedule</span><span class="v">${escapeHtml(p.loanTerms.sellerFinancingSchedule)}</span></div>
          </div>

          <div class="card static card-pad" style="margin-top:16px;">
            <button class="add-card-btn" style="margin-top:0;" onclick="alert('Coming soon — will let you upload the real purchase agreement here once document storage is wired up.')">📎 Upload purchase agreement</button>
          </div>

          ${renderICChat(p)}

          ${liquidityHtml}
        </div>
      `;
    }

    function editInvestorField(cardId, field, value) {
      for (const col of DATA.investorCrm.columns) {
        const c = col.cards.find(x => x.id === cardId);
        if (c) { c[field] = value; return; }
      }
    }

    function renderInvestorCRM() {
      const inv = DATA.investorCrm;
      const columnsHtml = inv.columns.map(col => `
        <div>
          <div class="inv-column-header">${escapeHtml(col.name)} · ${col.cards.length}</div>
          ${col.cards.map(c => `
            <div class="inv-card">
              <div class="inv-card-name">${escapeHtml(c.name)}</div>
              ${c.contact ? `<div class="inv-card-contact">${escapeHtml(c.contact)}</div>` : ''}
              <div class="inv-field-row"><span class="l">Ticket size</span><input type="text" placeholder="—" value="${escapeAttr(c.ticketSize)}" onchange="editInvestorField('${c.id}','ticketSize',this.value)"></div>
              <div class="inv-field-row"><span class="l">Equity ask %</span><input type="text" placeholder="—" value="${escapeAttr(c.equityAsk)}" onchange="editInvestorField('${c.id}','equityAsk',this.value)"></div>
            </div>
          `).join('')}
        </div>
      `).join('');

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Fund', path: '/fund' }, { label: 'Investor CRM' }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">Investor CRM</div>
          <div class="greeting-sub">Real pipeline, mirrored from the Investor CRM Trello board</div>
        </div>

        <div class="inv-prospect-tile">
          <div class="fund-stat-value">${inv.prospectCount}</div>
          <div class="fund-stat-sub">in Prospect — mass outreach, not shown as individual cards</div>
        </div>

        <div class="inv-board">
          ${columnsHtml}
        </div>
      `;
    }

    // ── Grow ──
    function renderGrow() {
      const g = DATA.grow;
      const companyCards = g.companies.map(c => {
        const logoHtml = c.logo
          ? `<div class="grow-pf-logo-wrap"><img class="grow-pf-logo" src="${escapeAttr(c.logo)}" alt="${escapeAttr(c.name)}"></div>`
          : `<div class="grow-pf-initials">${escapeHtml(c.initials || c.name.slice(0,2).toUpperCase())}</div>`;
        const badgeClass = c.status === 'active' ? 'green' : 'yellow';
        return `
          <a class="grow-pf-card" href="#/grow/company/${c.id}" onclick="navigate('/grow/company/${c.id}'); return false;">
            ${logoHtml}
            <div class="grow-pf-name">${escapeHtml(c.name)}</div>
            <span class="grow-pf-badge ${badgeClass}">${escapeHtml(c.statusLabel)}</span>
          </a>
        `;
      }).join('');
      const lockedCards = Array.from({ length: g.lockedSlots }, (_, i) => `
        <div class="grow-pf-card locked">
          <div class="lock">🔒</div>
          <div class="lk-name">Company ${g.companies.length + i + 1}</div>
        </div>
      `).join('');
      const totalStacks = g.companies.reduce((n, c) => n + (c.stacks || []).length, 0);
      const totalTools = g.companies.reduce((n, c) => n + (c.tools || []).length, 0);
      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Grow' }])}
        <div class="greeting">
          <div class="greeting-text" style="font-size:36px;">🌱 Grow</div>
          <div class="greeting-sub">Increase enterprise value — integration, ops, sales, SOPs, and KPI reporting.</div>
        </div>

        <div class="grow-kpi-strip">
          <div class="grow-kpi-tile">
            <div class="grow-kpi-label">Portfolio EBITDA target</div>
            <div class="grow-kpi-value">+10%</div>
            <div class="grow-kpi-note">in 6 months across active portfolio companies</div>
          </div>
          <div class="grow-kpi-tile">
            <div class="grow-kpi-label">Active companies</div>
            <div class="grow-kpi-value">${g.companies.length}</div>
            <div class="grow-kpi-note">Melers Oy · Auran Pesupojat Oy (closing)</div>
          </div>
          <div class="grow-kpi-tile">
            <div class="grow-kpi-label">Playbooks live</div>
            <div class="grow-kpi-value">${totalStacks}</div>
            <div class="grow-kpi-note">across the 🦔 Stack & Tools Library — cloneable to any portfolio company</div>
          </div>
          <a class="grow-kpi-tile glass" href="#/grow/stack-library" onclick="navigate('/grow/stack-library'); return false;">
            <div class="grow-kpi-label"><span class="greeting-emoji">🦔</span> Stack & Tools Library</div>
            <div class="grow-kpi-value">${totalStacks + totalTools}</div>
            <div class="grow-kpi-note">${totalStacks} playbooks · ${totalTools} tools — cross-portfolio search →</div>
          </a>
        </div>

        <div class="sec-label">Portfolio companies</div>
        <div class="grow-portfolio-row">
          ${companyCards}
          ${lockedCards}
        </div>
      `;
    }

    function renderGrowCompany(id) {
      const g = DATA.grow;
      const co = g.companies.find(c => c.id === id);
      if (!co) return renderGrow();

      const logoHtml = co.logo
        ? `<div class="grow-company-logo-wrap"><img class="grow-company-logo" src="${escapeAttr(co.logo)}" alt="${escapeAttr(co.name)}"></div>`
        : `<div class="grow-company-initials">${escapeHtml(co.initials || co.name.slice(0,2).toUpperCase())}</div>`;

      const steveChat = `
        <div class="grow-steve-card">
          <div class="grow-steve-header">🦔 Talk to Steve</div>
          <div class="grow-steve-msgs">
            <div class="grow-steve-msg partner">What should we focus on first for ${escapeHtml(co.name)}?</div>
            <div class="grow-steve-msg steve">Good question. My read: start with Knowledge Transfer — nothing else stacks well until the handover is locked. Once banking, ops, and passwords are settled, Recruiting is the next unlock since everything downstream (sales SOP, training videos, marketing) depends on having the right people running the show. Software and marketing can run in parallel after that.</div>
            <div class="grow-steve-msg partner">How do we track EBITDA growth here?</div>
            <div class="grow-steve-msg steve">🦔 Honestly, not wired yet — the +10% target lives in Fund (revenue, costs, management fee) but none of those numbers flow into Grow yet. When you're ready to wire this, I'd suggest pulling the monthly liquidity snapshot from Fund and computing a trailing EBITDA delta. For now, the best proxy is checking the Fund page for this company and eyeballing the trend.</div>
          </div>
          <div class="grow-steve-input-row">
            <input type="text" class="grow-steve-input" placeholder="Ask Steve something about ${escapeHtml(co.name)}…" disabled>
            <button class="grow-steve-send" disabled>→</button>
          </div>
          <div class="grow-steve-note">Static demo — live Steve input coming in a future iteration</div>
        </div>
      `;

      return `
        ${crumbs([{ label: 'Company', path: '/' }, { label: 'Grow', path: '/grow' }, { label: co.name }])}
        <div class="grow-company-header">
          ${logoHtml}
          <div>
            <div class="grow-company-name">${escapeHtml(co.name)}</div>
            <div class="grow-company-sub">${escapeHtml(co.statusLabel)} · Grow plan</div>
          </div>
        </div>
        ${co.ddBanner ? `<div class="grow-dd-banner">⚠️ ${escapeHtml(co.ddBanner)}</div>` : ''}
        ${renderGrowHero(co)}
        ${steveChat}
        ${renderGrowKt(co)}
        ${renderGrowStacksSection(co)}
        ${renderGrowToolsSection(co)}
      `;
    }

    window.addEventListener('hashchange', render);
    render();
  </script>

</body>
</html>
